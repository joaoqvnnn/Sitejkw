<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora — Abertura de Conta</title>
<style>
  /* =========================================================
     DESIGN SYSTEM — BANCO DIGITAL (TEMA CLARO PROFISSIONAL)
     ========================================================= */
  :root{
    --bg: #FFFFFF;
    --bg-subtle: #F8FAFC;
    --bg-muted: #F1F5F9;
    --border: #E2E8F0;
    --border-strong: #CBD5E1;
    --border-input: #D6DDE6;
    --text: #0B1220;
    --text-secondary: #475569;
    --text-tertiary: #64748B;
    --text-muted: #94A3B8;
    --primary: #0B1220;
    --primary-hover: #1E293B;
    --accent: #1D4ED8;
    --accent-hover: #1E40AF;
    --accent-soft: #EFF6FF;
    --accent-border: #BFDBFE;
    --success: #047857;
    --success-soft: #ECFDF5;
    --danger: #B91C1C;
    --danger-soft: #FEF2F2;
    --radius-sm: 8px;
    --radius: 12px;
    --radius-lg: 16px;
    --shadow-card: 0 1px 2px rgba(11,18,32,.04), 0 1px 3px rgba(11,18,32,.06);
    --shadow-elev: 0 4px 12px rgba(11,18,32,.06), 0 2px 4px rgba(11,18,32,.04);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *, *::before, *::after{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    position: relative;
  }
  body::before{
    content:"";
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 88% -10%, rgba(29,78,216,.06), transparent 42%),
      radial-gradient(circle at -5% 105%, rgba(29,78,216,.04), transparent 40%);
    pointer-events: none;
    z-index: 0;
  }

  [hidden]{ display: none !important; }
  button{ font-family: inherit; }

  /* =========================================================
     ESTRUTURA
     ========================================================= */
  #app{ position: relative; z-index: 1; min-height: 100vh; }

  .appbar{
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,.92);
    backdrop-filter: saturate(180%) blur(8px);
    -webkit-backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .appbar-inner{
    max-width: 480px; margin: 0 auto;
    padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand{ display: flex; align-items: center; gap: 10px; }
  .brand-mark{
    width: 30px; height: 30px; border-radius: 8px;
    background: var(--primary); color: #fff;
    display: grid; place-items: center;
    font-weight: 800; font-size: 14px; letter-spacing: -.02em;
  }
  .brand-name{
    font-weight: 700; font-size: 13px;
    letter-spacing: .28em; color: var(--text);
  }

  .shell{
    max-width: 480px; margin: 0 auto;
    padding: 22px 20px 48px;
  }

  /* =========================================================
     PROGRESSO
     ========================================================= */
  .progress{ margin-bottom: 18px; }
  .progress-head{
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .progress-label{
    font-size: 11px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--text-tertiary);
  }
  .progress-pct{
    font-size: 12px; font-weight: 600;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .progress-track{
    height: 4px; background: var(--bg-muted);
    border-radius: 99px; overflow: hidden;
  }
  .progress-fill{
    height: 100%; border-radius: 99px;
    background: var(--accent);
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }

  /* =========================================================
     CARTÃO PRINCIPAL
     ========================================================= */
  .card{
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 28px 24px 24px;
    box-shadow: var(--shadow-card);
  }
  .step{ animation: stepIn .35s cubic-bezier(.22,.8,.3,1); }
  @keyframes stepIn{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* =========================================================
     TIPOGRAFIA DENTRO DO CARTÃO
     ========================================================= */
  .eyebrow{
    display: inline-block;
    font-size: 11px; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }
  h1, h2, h3{ margin: 0; color: var(--text); }
  h2{
    font-size: 22px; line-height: 1.3;
    font-weight: 700; letter-spacing: -.015em;
  }
  .sub{
    margin: 8px 0 0; color: var(--text-tertiary);
    font-size: 14px; line-height: 1.55;
  }
  .step-head{ margin-bottom: 22px; }
  .label{
    display: block;
    font-size: 12px; font-weight: 600;
    letter-spacing: .02em;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .hint{
    margin-top: 8px;
    font-size: 12.5px; color: var(--text-tertiary);
    line-height: 1.5;
  }
  .hint strong{ color: var(--text); }
  .warn{
    margin-top: 12px; padding: 12px 14px;
    background: var(--danger-soft);
    border: 1px solid #FECACA;
    border-radius: var(--radius);
    color: var(--danger);
    font-size: 13px; line-height: 1.5;
  }
  .foot{
    margin: 24px auto 0; max-width: 480px;
    text-align: center;
    font-size: 11.5px; color: var(--text-muted);
    line-height: 1.6;
  }

  /* =========================================================
     CAMPOS
     ========================================================= */
  .field{ margin-bottom: 20px; }
  .field:last-child{ margin-bottom: 0; }
  .row{ display: flex; gap: 10px; }
  .row > *{ flex: 1; min-width: 0; }

  .input, select.input{
    width: 100%;
    padding: 12px 14px;
    min-height: 46px;
    background: var(--bg);
    border: 1px solid var(--border-input);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
    appearance: none;
    -webkit-appearance: none;
  }
  .input::placeholder{ color: var(--text-muted); }
  .input:hover{ border-color: var(--border-strong); }
  .input:focus{
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(29,78,216,.12);
  }
  .input:disabled{ background: var(--bg-subtle); color: var(--text-muted); }

  select.input{
    background-image:
      linear-gradient(45deg, transparent 50%, var(--text-tertiary) 50%),
      linear-gradient(135deg, var(--text-tertiary) 50%, transparent 50%);
    background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }

  /* =========================================================
     OPÇÕES (BOTÕES DE SELEÇÃO)
     ========================================================= */
  .options{ display: flex; flex-wrap: wrap; gap: 8px; }
  .options.col{ flex-direction: column; }
  .opt{
    flex: 1 1 auto;
    min-width: calc(50% - 4px);
    padding: 12px 14px;
    text-align: left;
    background: var(--bg);
    border: 1px solid var(--border-input);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    line-height: 1.4;
    cursor: pointer;
    transition: border-color .15s, background .15s, color .15s, box-shadow .15s;
  }
  .opt:hover{
    border-color: var(--border-strong);
    background: var(--bg-subtle);
  }
  .opt.selected{
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-hover);
    font-weight: 600;
    box-shadow: 0 0 0 3px rgba(29,78,216,.08);
  }
  .options.col .opt{ min-width: 100%; }

  /* =========================================================
     LISTAS
     ========================================================= */
  .list{
    margin-top: 8px;
    max-height: 200px;
    overflow-y: auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .list::-webkit-scrollbar{ width: 6px; }
  .list::-webkit-scrollbar-thumb{
    background: var(--border-strong); border-radius: 99px;
  }
  .list-item{
    display: block; width: 100%; text-align: left;
    padding: 11px 14px;
    background: none; border: 0;
    border-bottom: 1px solid var(--border);
    color: var(--text); font-family: inherit;
    font-size: 14px; cursor: pointer;
    transition: background .12s;
  }
  .list-item:last-child{ border-bottom: 0; }
  .list-item:hover{ background: var(--bg-subtle); }
  .empty{
    padding: 16px; text-align: center;
    font-size: 13px; color: var(--text-tertiary);
  }

  /* =========================================================
     CHIPS
     ========================================================= */
  .chips{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .selection{ margin-top: 10px; min-height: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip{
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px;
    font-size: 13px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    color: var(--accent-hover);
    border-radius: 99px;
    font-weight: 500;
  }
  .chip button{
    background: none; border: 0; padding: 0;
    color: var(--accent); cursor: pointer;
    font-family: inherit; font-size: 12px;
    text-decoration: underline;
  }

  /* =========================================================
     BOTÕES
     ========================================================= */
  .btn{
    display: block; width: 100%;
    padding: 14px 18px;
    min-height: 50px;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 14px; font-weight: 600;
    letter-spacing: .04em;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background .15s, border-color .15s, color .15s, transform .1s;
  }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover{ background: var(--primary-hover); }
  .btn-ghost{
    background: var(--bg);
    color: var(--text);
    border-color: var(--border-strong);
  }
  .btn-ghost:hover{ background: var(--bg-subtle); }
  .btn + .btn{ margin-top: 10px; }

  .nav{ display: flex; gap: 10px; margin-top: 26px; }
  .nav .btn{ margin-top: 0; }
  .nav .btn-ghost{ flex: 0 0 34%; }

  .link{
    background: none; border: 0; padding: 0;
    color: var(--accent);
    font-family: inherit; font-size: 13px;
    font-weight: 600; cursor: pointer;
    text-decoration: none;
  }
  .link:hover{ text-decoration: underline; }
  .link.center{
    display: block; width: 100%; text-align: center;
    margin-top: 16px; color: var(--text-tertiary);
    font-weight: 500; font-size: 13px;
  }
  .link.center:hover{ color: var(--text); }

  /* =========================================================
     TELA INICIAL (WELCOME)
     ========================================================= */
  .welcome{
    max-width: 480px; margin: 0 auto;
    padding: 20px 24px 40px;
    min-height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center;
  }
  .welcome-top{
    display: flex; justify-content: center;
    margin-bottom: 28px;
  }
  .welcome-logo{
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: 99px;
  }
  .welcome-logo .brand-mark{
    width: 26px; height: 26px; border-radius: 7px; font-size: 13px;
  }
  .welcome-logo .brand-name{
    font-size: 11px; letter-spacing: .3em;
  }

  .welcome-content{
    text-align: center;
    animation: stepIn .5s ease-out;
  }
  .welcome-eyebrow{
    font-size: 11px; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .welcome-title{
    font-size: 30px; line-height: 1.18;
    font-weight: 700; letter-spacing: -.02em;
    color: var(--text);
    margin: 0 0 14px;
  }
  .welcome-subtitle{
    font-size: 15px; color: var(--text-tertiary);
    line-height: 1.55;
    margin: 0 0 8px;
    max-width: 340px; margin-left: auto; margin-right: auto;
  }
  .welcome-rotate{
    font-size: 13.5px; color: var(--text-secondary);
    margin: 0 0 32px;
    min-height: 20px;
    transition: opacity .3s;
  }

  .welcome-actions{ text-align: left; }
  .welcome-actions .btn-primary{
    box-shadow: 0 6px 16px rgba(11,18,32,.16);
  }

  .about{
    margin-top: 24px;
    padding: 16px 18px;
    background: var(--bg-subtle);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px; color: var(--text-tertiary);
    line-height: 1.65;
    text-align: left;
  }
  .about strong{
    display: block; color: var(--text);
    font-size: 12px; letter-spacing: .04em;
    margin-bottom: 6px; text-transform: uppercase;
  }

  /* =========================================================
     REVISÃO
     ========================================================= */
  .review-block{
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .review-head{
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
  }
  .review-head > span{
    font-size: 11.5px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--text-secondary);
  }
  .review-body{ padding: 8px 14px 10px; }
  .review-row{
    display: flex; justify-content: space-between; gap: 14px;
    padding: 7px 0;
    font-size: 13.5px;
    border-bottom: 1px dashed transparent;
  }
  .review-row + .review-row{ border-top: 1px solid var(--border); }
  .review-row .rk{ color: var(--text-tertiary); flex: 0 0 42%; }
  .review-row .rv{
    color: var(--text); text-align: right;
    word-break: break-word; font-weight: 500;
  }

  /* =========================================================
     CONTRATOS
     ========================================================= */
  .contract{
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    background: var(--bg);
  }
  .contract-head{
    padding: 13px 15px;
    font-size: 13.5px; font-weight: 600;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    background: var(--bg-subtle);
  }
  .contract-body{
    max-height: 140px; overflow-y: auto;
    padding: 14px 15px;
    font-size: 13px; color: var(--text-secondary);
    line-height: 1.65;
  }
  .contract-body::-webkit-scrollbar{ width: 6px; }
  .contract-body::-webkit-scrollbar-thumb{
    background: var(--border-strong); border-radius: 99px;
  }
  .contract-body p{ margin: 0 0 10px; }
  .contract-body p:last-child{ margin-bottom: 0; }
  .contract-check{
    display: flex; align-items: flex-start; gap: 11px;
    padding: 13px 15px;
    border-top: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
    user-select: none;
  }
  .contract-check input{
    appearance: none; -webkit-appearance: none;
    width: 19px; height: 19px; flex: 0 0 19px;
    margin: 1px 0 0;
    border: 1.5px solid var(--border-strong);
    border-radius: 5px;
    background: var(--bg);
    cursor: pointer;
    position: relative;
    transition: .15s;
  }
  .contract-check input:checked{
    background: var(--accent);
    border-color: var(--accent);
  }
  .contract-check input:checked::after{
    content: "";
    position: absolute;
    left: 5px; top: 1px;
    width: 5px; height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .contract-check span{ color: var(--text-secondary); line-height: 1.5; }

  /* =========================================================
     FORÇA DE SENHA
     ========================================================= */
  .strength{ display: flex; gap: 5px; margin-top: 10px; }
  .strength span{
    height: 3px; flex: 1;
    border-radius: 99px;
    background: var(--bg-muted);
    transition: background .3s;
  }
  .strength.s1 span:nth-child(1){ background: #DC2626; }
  .strength.s2 span:nth-child(-n+2){ background: #D97706; }
  .strength.s3 span:nth-child(-n+3){ background: #059669; }
  .strength.s4 span{ background: var(--accent); }
  .reqs{
    margin-top: 10px;
    font-size: 12.5px; color: var(--text-tertiary);
    line-height: 1.9;
  }
  .reqs .ok{ color: var(--success); font-weight: 500; }
  .reqs .ok::before{ content: "· "; }

  /* =========================================================
     CAPTURA DE DOCUMENTO
     ========================================================= */
  .capture-row{
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 14px 15px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    background: var(--bg);
  }
  .capture-row .ct{ font-size: 14px; font-weight: 500; color: var(--text); }
  .capture-row .cs{ font-size: 12px; color: var(--text-tertiary); margin-top: 2px; }
  .capture-btn{
    padding: 9px 14px;
    border-radius: var(--radius-sm);
    font-size: 11.5px; font-weight: 700;
    letter-spacing: .06em;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
    flex: 0 0 auto;
    transition: background .15s, border-color .15s, color .15s;
  }
  .capture-btn:hover{ background: var(--bg-subtle); }
  .capture-btn.done{
    background: var(--success-soft);
    border-color: var(--success);
    color: var(--success);
  }

  /* =========================================================
     TIMELINE (STATUS)
     ========================================================= */
  .timeline{ margin: 20px 0 0; }
  .tl-item{
    position: relative;
    padding: 0 0 22px 28px;
    font-size: 14px;
    color: var(--text-muted);
    transition: color .35s;
  }
  .tl-item::before{
    content: "";
    position: absolute; left: 0; top: 4px;
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid var(--border-strong);
    background: var(--bg);
    transition: .35s;
  }
  .tl-item::after{
    content: "";
    position: absolute; left: 5px; top: 18px; bottom: 0;
    width: 1px; background: var(--border);
  }
  .tl-item:last-child::after{ display: none; }
  .tl-item.done{ color: var(--text); }
  .tl-item.done::before{
    border-color: var(--accent);
    background: var(--accent);
  }
  .tl-item.current{ color: var(--accent); font-weight: 600; }
  .tl-item.current::before{
    border-color: var(--accent);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(29,78,216,.35); }
    50%{ box-shadow: 0 0 0 8px rgba(29,78,216,0); }
  }

  /* =========================================================
     TOAST
     ========================================================= */
  .toast{
    position: fixed; left: 50%; bottom: 24px;
    transform: translate(-50%, 20px);
    background: var(--primary);
    color: #fff;
    padding: 13px 20px;
    border-radius: var(--radius);
    font-size: 13.5px;
    max-width: 88vw;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: .3s;
    z-index: 50;
    box-shadow: 0 12px 28px rgba(11,18,32,.22);
  }
  .toast.show{ opacity: 1; transform: translate(-50%, 0); }

  /* =========================================================
     RESPONSIVO
     ========================================================= */
  @media (max-width: 380px){
    .card{ padding: 22px 18px 20px; }
    .shell{ padding: 16px 14px 36px; }
    h2{ font-size: 20px; }
    .welcome-title{ font-size: 26px; }
  }
</style>
</head>
<body>

<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   AURORA — MÓDULO 1 — ABERTURA DE CONTA
   ========================================================= */

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
));
const norm = s => (s || '').toString().toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function getPath(obj, path){
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, value){
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++){
    if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = value;
}

/* ---------- catálogo de países ---------- */
const COUNTRIES_RAW = `Afeganistão|AF|93
África do Sul|ZA|27
Albânia|AL|355
Alemanha|DE|49
Andorra|AD|376
Angola|AO|244
Antígua e Barbuda|AG|1
Arábia Saudita|SA|966
Argélia|DZ|213
Argentina|AR|54
Armênia|AM|374
Austrália|AU|61

  const [n, c, d] = line.split('|');
  return { n, c, d };
}).sort((a, b) => a.n.localeCompare(b.n, 'pt-BR'));

(async function loadCountriesAPI(){
  try{
    const res = await fetch('https://restcountries.com/v3.1/all?fields=name,translations,cca2,idd');
    if (!res.ok) return;
    const json = await res.json();
    const list = json.map(c => {
      const name = (c.translations && c.translations.por && c.translations.por.common) || c.name.common;
      const dial = c.idd && c.idd.root ? (c.idd.root + ((c.idd.suffixes && c.idd.suffixes[0]) || '')).replace('+', '') : '';
      return { n: name, c: c.cca2, d: dial };
    }).filter(x => x.c && x.n);
    if (list.length > 150){
      COUNTRIES = list.sort((a, b) => a.n.localeCompare(b.n, 'pt-BR'));
    }
  }catch(e){ /* mantém local */ }
})();

function countryName(iso){
  const c = COUNTRIES.find(x => x.c === iso);
  return c ? c.n : iso;
}
function countryDial(iso){
  const c = COUNTRIES.find(x => x.c === iso);
  return c ? c.d : '';
}

function validCPF(cpf){
  cpf = (cpf || '').replace(/\D/g, '');
  if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
  let s = 0;
  for (let i = 0; i < 9; i++) s += parseInt(cpf[i]) * (10 - i);
  let d1 = (s * 10) % 11; if (d1 === 10) d1 = 0;
  if (d1 !== parseInt(cpf[9])) return false;
  s = 0;
  for (let i = 0; i < 10; i++) s += parseInt(cpf[i]) * (11 - i);
  let d2 = (s * 10) % 11; if (d2 === 10) d2 = 0;
  return d2 === parseInt(cpf[10]);
}
function calcAge(dateStr){
  if (!dateStr) return -1;
  const b = new Date(dateStr + 'T00:00:00');
  if (isNaN(b.getTime())) return -1;
  const t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
}
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((v || '').trim()); }

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    const merged = JSON.parse(JSON.stringify(DEFAULT_DATA));
    const src = parsed.data || {};
    for (const k in merged){
      if (src[k] === undefined) continue;
      if (typeof merged[k] === 'object' && merged[k] !== null && !Array.isArray(merged[k])){
        merged[k] = Object.assign({}, merged[k], src[k]);
      } else {
        merged[k] = src[k];
      }
    }
    state = { step: typeof parsed.step === 'number' ? parsed.step : 0, data: merged };
  }catch(e){}
}

  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  state = { step: 0, data: JSON.parse(JSON.stringify(DEFAULT_DATA)) };
  render(true);
}

function optGroup(group, items, current, extraClass){
  return `<div class="options ${extraClass || ''}" data-group="${group}">` + items.map(it => {
    const v = typeof it === 'string' ? it : it.v;
    const l = typeof it === 'string' ? it : it.l;
    const sel = String(current) === String(v) ? 'selected' : '';
    return `<button type="button" class="opt ${sel}" data-value="${esc(v)}">${esc(l)}</button>`;
  }).join('') + `</div>`;
}
function multiGroup(group, items, current){
  const cur = current || [];
  return `<div class="options" data-multi="${group}">` + items.map(it => {
    const v = typeof it === 'string' ? it : it.v;
    const l = typeof it === 'string' ? it : it.l;
    const sel = cur.includes(v) ? 'selected' : '';
    return `<button type="button" class="opt ${sel}" data-value="${esc(v)}">${esc(l)}</button>`;
  }).join('') + `</div>`;
}
function countrySelectOptions(selected){
  return `<option value="">Selecione</option>` + COUNTRIES.map(c =>
    `<option value="${c.c}" ${c.c === selected ? 'selected' : ''}>${esc(c.n)}</option>`
  ).join('');
}
function chipCountry(iso){
  return iso ? `<span class="chip">${esc(countryName(iso))}</span>` : '';
}
function renderCountryList(container, query, onPick, limit){
  if (!container) return;
  const q = norm(query);
  const items = COUNTRIES.filter(c => !q || norm(c.n).includes(q)).slice(0, limit || 80);
  container.innerHTML = items.length
    ? items.map(c => `<button type="button" class="list-item" data-iso="${c.c}">${esc(c.n)}</button>`).join('')
    : '<div class="empty">Nenhum resultado encontrado</div>';
  $$('[data-iso]', container).forEach(btn => {
    btn.onclick = () => onPick(btn.dataset.iso);
  });
}

function docOptions(){

    { v: 'CPF', l: 'CPF' },
    { v: 'RG', l: 'RG' },
    { v: 'CIN', l: 'CIN (Carteira de Identidade Nacional)' },
    { v: 'CNH', l: 'CNH' },
    { v: 'PASSAPORTE_BR', l: 'Passaporte brasileiro' }
  ];
  if (brRes && !brNat) return [
    { v: 'CRNM', l: 'CRNM (Carteira de Registro Nacional Migratório)' },
    { v: 'PROTOCOLO', l: 'Protocolo de solicitação de residência' },
    { v: 'PASSAPORTE', l: 'Passaporte' },
    { v: 'DOC_ESTRANGEIRO', l: 'Documento de identidade estrangeiro' }

    { v: 'CNH', l: 'Carteira de habilitação' },

    ['Valor aproximado', d.extraValue]
  ])}

  ${reviewSection('Informações adicionais', 11, [
    ['PEP', d.pep === 'sim' ? 'Sim' : (d.pep === 'nao' ? 'Não' : '')],
    ['Relação com PEP', d.pepRelated === 'sim' ? 'Sim' : (d.pepRelated === 'nao' ? 'Não' : '')],
    ['Finalidade', (d.purpose || []).join(', ')],
    ['Movimentação esperada', d.movement]
  ])}`;
}

/* ETAPA 14 */
function stepContratos(){
  const blocks = [
    { key: 'account', title: 'Contrato de abertura de conta',
      text: 'Este contrato estabelece as condições de abertura e manutenção da conta digital, os direitos e as obrigações do titular e da instituição, as hipóteses de bloqueio e encerramento, além dos canais de atendimento disponíveis. A contratação é realizada de forma eletrônica, com registro de aceite e trilha de auditoria.' },
    { key: 'terms', title: 'Termos e condições de uso',
      text: 'Os termos descrevem as regras de utilização do aplicativo, as responsabilidades do usuário quanto à guarda de senhas e dispositivos, os limites operacionais e as condições de suspensão do acesso por motivo de segurança.' },
    { key: 'privacy', title: 'Política de privacidade',
      text: 'Os dados pessoais são tratados para fins de identificação, qualificação, prevenção a fraudes, cumprimento de obrigações regulatórias e prestação dos serviços contratados. O titular pode exercer os direitos previstos na legislação aplicável pelos canais oficiais de atendimento.' },
    { key: 'fees', title: 'Informações sobre tarifas',
      text: 'A instituição informa previamente os serviços sujeitos a cobrança, os valores praticados e os canais para consulta da tabela vigente. Serviços essenciais permanecem disponíveis conforme a regulamentação aplicável.' }
  ];

  return `
  <div class="step-head">
    <span class="eyebrow">Contratos e envio</span>
    <h2>Leia e confirme os documentos</h2>
    <p class="sub">Todos os aceites são obrigatórios para enviar a solicitação.</p>
  </div>

  ${blocks.map(b => `
    <div class="contract">
      <div class="contract-head">${b.title}</div>
      <div class="contract-body">
        <p>${b.text}</p>
        <p>Documento de demonstração. O texto completo deve ser disponibilizado para leitura antes do aceite.</p>
      </div>
      <label class="contract-check">
        <input type="checkbox" data-bind="contracts.${b.key}">
        <span>Li e concordo com o documento acima.</span>
      </label>
    </div>
  `).join('')}

  <div class="hint">Ao enviar, a solicitação entra na fila de análise. A aprovação não é automática.</div>`;
}

/* =========================================================
   STATUS (ETAPA 16)
   ========================================================= */
const STATUS_STEPS = [
  'Solicitação recebida',
  'Verificando documentos',
  'Verificando identidade',
  'Análise cadastral'
];

function statusHTML(){
  const protocol = state.data.protocol || '—';
  return `
  <div class="appbar">
    <div class="appbar-inner">
      <div class="brand">
        <span class="brand-mark">A</span>
        <span class="brand-name">AURORA</span>
      </div>
    </div>
  </div>

  <div class="shell">
    <section class="card step">
      <span class="eyebrow">Solicitação enviada</span>
      <h2>Recebemos sua solicitação</h2>
      <p class="sub">Protocolo ${esc(protocol)}</p>

      <div class="timeline" id="timeline">
        ${STATUS_STEPS.map(s => `<div class="tl-item">${s}</div>`).join('')}
      </div>

      <p class="hint" id="statusNote" hidden style="margin-top:20px">
        A solicitação permanece em análise pelo time responsável. O status exibido é simulado
        neste ambiente. Em produção, o status viria do sistema real de análise cadastral.
      </p>

      <div class="nav" style="margin-top:26px">
        <button class="btn btn-ghost" id="btnCancel" style="flex:1">CANCELAR</button>
        <button class="btn btn-primary" id="btnHome" style="flex:1.4">VOLTAR AO INÍCIO</button>
      </div>
    </section>

    <p class="foot">Ambiente de demonstração. Nenhum dado é enviado a instituições financeiras.</p>
  </div>`;
}

function bindStatus(){
  const items = $$('#timeline .tl-item');
  let i = 0;
  const run = () => {
    if (i >= items.length){
      const note = document.getElementById('statusNote');
      if (note) note.hidden = false;
      return;
    }
    items[i].classList.add('current');
    setTimeout(() => {
      items[i].classList.remove('current');
      items[i].classList.add('done');
      i++;
      run();
    }, 1100);
  };
  setTimeout(run, 400);

  const home = document.getElementById('btnHome');
  if (home) home.onclick = () => { state.step = 0; save(); render(true); };

  const cancel = document.getElementById('btnCancel');
  if (cancel) cancel.onclick = () => {
    if (confirm('Deseja cancelar a solicitação e apagar os dados preenchidos?')) resetAll();
  };
}

/* =========================================================
   BINDINGS
   ========================================================= */
function bindCommon(){
  $$('[data-bind]').forEach(inp => {
    const p = inp.dataset.bind;
    const v = getPath(state.data, p);
    if (inp.type === 'checkbox') inp.checked = !!v;
    else if (v !== undefined && v !== null && document.activeElement !== inp) inp.value = v;

    const handler = () => {
      const value = inp.type === 'checkbox' ? inp.checked : inp.value;
      setPath(state.data, p, value);
      save();
      if (typeof syncAll === 'function') syncAll();
    };
    inp.addEventListener('input', handler);
    inp.addEventListener('change', handler);
  });

  bindOptions();

  const back = document.getElementById('btnBack');
  if (back) back.onclick = () => {
    if (state.step <= 1){ state.step = 0; save(); render(true); return; }
    go(state.step - 1);
  };

  const next = document.getElementById('btnNext');
  if (next) next.onclick = () => {
    const res = validateStep(state.step);
    if (!res.ok){ toast(res.msg); return; }
    if (state.step === 14){ submitRequest(); return; }
    go(state.step + 1);
  };

  const exit = document.getElementById('btnExit');
  if (exit) exit.onclick = () => { state.step = 0; save(); render(true); };

  $$('[data-goto]').forEach(btn => {
    btn.onclick = () => go(parseInt(btn.dataset.goto, 10));
  });
}

function bindOptions(){
  $$('.options[data-group]').forEach(box => {
    const g = box.dataset.group;
    const refresh = () => {
      const cur = String(getPath(state.data, g));
      $$('.opt', box).forEach(b => b.classList.toggle('selected', cur === b.dataset.value));
    };
    refresh();
    $$('.opt', box).forEach(btn => {
      btn.onclick = () => {
        setPath(state.data, g, btn.dataset.value);
        save(); refresh(); syncAll();
      };
    });
  });

  $$('.options[data-multi]').forEach(box => {
    const g = box.dataset.multi;
    const refresh = () => {
      const cur = getPath(state.data, g) || [];
      $$('.opt', box).forEach(b => b.classList.toggle('selected', cur.includes(b.dataset.value)));
    };
    refresh();
    $$('.opt', box).forEach(btn => {
      btn.onclick = () => {
        const cur = (getPath(state.data, g) || []).slice();
        const i = cur.indexOf(btn.dataset.value);
        if (i >= 0) cur.splice(i, 1); else cur.push(btn.dataset.value);
        setPath(state.data, g, cur);
        save(); refresh(); syncAll();
      };
    });
  });
}

/* ---------- bindings específicos ---------- */
function bindStep(){
  const d = state.data;

  switch (state.step){
    case 1: {
      const natSearch = document.getElementById('natSearch');
      const natList = document.getElementById('natList');
      const resSearch = document.getElementById('resSearch');
      const resList = document.getElementById('resList');
      const otherSearch = document.getElementById('otherSearch');
      const otherList = document.getElementById('otherList');

      renderCountryList(natList, '', iso => { d.nationality = iso; save(); rerender(); });
      natSearch.oninput = () => renderCountryList(natList, natSearch.value, iso => { d.nationality = iso; save(); rerender(); });

      renderCountryList(resList, '', iso => { d.residence = iso; save(); rerender(); });
      resSearch.oninput = () => renderCountryList(resList, resSearch.value, iso => { d.residence = iso; save(); rerender(); });

      const addOther = iso => {
        if (iso === d.nationality){ toast('A nacionalidade principal já foi informada.'); return; }
        if (!d.otherNationalities.includes(iso)) d.otherNationalities.push(iso);
        save(); rerender();
      };
      renderCountryList(otherList, '', addOther);
      otherSearch.oninput = () => renderCountryList(otherList, otherSearch.value, addOther);

      $$('[data-remove]').forEach(btn => {
        btn.onclick = () => {
          d.otherNationalities = d.otherNationalities.filter(x => x !== btn.dataset.remove);
          save(); rerender();
        };
      });

      syncAll = () => {
        const box = document.getElementById('otherBox');
        if (box) box.hidden = d.otherNationality !== 'sim';
      };
      break;
    }

    case 2: {
      syncAll = () => {
        const box = document.getElementById('cpfBox');
        if (!box) return;
        const br = d.nationality === 'BR' || d.residence === 'BR';
        box.hidden = !(br && d.docType !== 'CPF');
      };
      break;
    }

    case 3: {
      const birth = document.getElementById('birthDate');
      syncAll = () => {
        const warn = document.getElementById('minorWarn');
        if (!warn) return;
        const a = calcAge(d.birthDate);
        warn.hidden = !(a >= 0 && a < 18);
      };
      if (birth) birth.addEventListener('change', syncAll);
      break;
    }

    case 5: {
      const sendPhone = document.getElementById('btnSendPhone');
      if (sendPhone) sendPhone.onclick = () => {
        if (!d.phone.ddd || !d.phone.number){ toast('Informe DDD e número do celular.'); return; }
        d.phone.sentCode = String(Math.floor(100000 + Math.random() * 900000));
        d.phone.verified = false;
        save();
        toast('Código simulado enviado por SMS: ' + d.phone.sentCode);
        rerender();
      };

      const confirmPhone = document.getElementById('btnConfirmPhone');
      if (confirmPhone) confirmPhone.onclick = () => {
        if (d.phone.code === d.phone.sentCode && d.phone.sentCode){
          d.phone.verified = true; save(); toast('Telefone verificado.');
        } else toast('Código incorreto.');
        rerender();
      };

      const sendEmail = document.getElementById('btnSendEmail');
      if (sendEmail) sendEmail.onclick = () => {
        if (!validEmail(d.email.value)){ toast('Informe um e-mail válido.'); return; }
        d.email.sentCode = String(Math.floor(100000 + Math.random() * 900000));
        d.email.verified = false;
        save();
        toast('Código simulado enviado por e-mail: ' + d.email.sentCode);
        rerender();
      };

      const confirmEmail = document.getElementById('btnConfirmEmail');
      if (confirmEmail) confirmEmail.onclick = () => {
        if (d.email.code === d.email.sentCode && d.email.sentCode){
          d.email.verified = true; save(); toast('E-mail verificado.');
        } else toast('Código incorreto.');
        rerender();
      };

      syncAll = () => {};
      break;
    }

    case 6: {
      const search = document.getElementById('profSearch');
      const list = document.getElementById('profList');
      const otherBox = document.getElementById('otherProfBox');
      if (otherBox) otherBox.hidden = !d.professionOther;

      const renderList = (q) => {
        const query = norm(q);
        const items = PROFESSIONS.filter(p => !query || norm(p).includes(query)).slice(0, 200);
        list.innerHTML = items.length
          ? items.map(p => `<button type="button" class="list-item" data-prof="${esc(p)}">${esc(p)}</button>`).join('')
          : '<div class="empty">Nenhuma profissão encontrada. Use a opção abaixo.</div>';
        $$('[data-prof]', list).forEach(btn => {
          btn.onclick = () => {
            d.profession = btn.dataset.prof;
            d.professionOther = '';
            save(); rerender();
          };
        });
      };
      renderList('');
      search.oninput = () => renderList(search.value);

      const otherBtn = document.getElementById('btnOtherProf');
      if (otherBtn) otherBtn.onclick = () => {
        const box = document.getElementById('otherProfBox');
        box.hidden = !box.hidden;
        if (!box.hidden) setTimeout(() => $('[data-bind="professionOther"]', box).focus(), 60);
      };

      const clearProf = document.getElementById('clearProf');
      if (clearProf) clearProf.onclick = () => { d.profession = ''; save(); rerender(); };

      const clearOther = document.getElementById('clearProfOther');
      if (clearOther) clearOther.onclick = () => { d.professionOther = ''; save(); rerender(); };

      syncAll = () => {};
      break;
    }

    case 8: {
      syncAll = () => {
        const box = document.getElementById('extraBox');
        if (box) box.hidden = d.extraIncome !== 'sim';
      };
      break;
    }

    case 9: {
      syncAll = () => {
        const box = document.getElementById('patrimonyBox');
        if (box) box.hidden = d.patrimony !== 'sim';
      };
      break;
    }

    case 10: {
      $$('[data-capture]').forEach(btn => {
        btn.onclick = () => {
          const key = btn.dataset.capture;
          d.idv[key] = !d.idv[key];
          save(); rerender();
        };
      });
      syncAll = () => {};
      break;
    }

    case 12: {
      const pwd = document.getElementById('pwd');
      const pwd2 = document.getElementById('pwd2');
      const bar = document.getElementById('strength');
      const reqs = document.getElementById('reqs');
      const show = document.getElementById('showPwd');

      const evaluate = () => {
        const v = pwd.value || '';
        const checks = {
          len: v.length >= 8,
          upper: /[A-Z]/.test(v),
          lower: /[a-z]/.test(v),
          digit: /\d/.test(v),
          special: /[^A-Za-z0-9]/.test(v)
        };
        let score = 0;
        Object.keys(checks).forEach(k => {
          const el = reqs.querySelector(`[data-req="${k}"]`);
          if (el) el.classList.toggle('ok', checks[k]);
          if (checks[k]) score++;
        });
        bar.className = 'strength s' + Math.min(score, 4);
      };

      if (pwd) pwd.addEventListener('input', evaluate);
      evaluate();

      if (show) show.addEventListener('change', () => {
        const t = show.checked ? 'text' : 'password';
        if (pwd) pwd.type = t;
        if (pwd2) pwd2.type = t;
      });

      syncAll = () => {};
      break;
    }
  }
}

/* =========================================================
   VALIDAÇÃO
   ========================================================= */
function validateStep(step){
  const d = state.data;

  switch (step){
    case 1:
      if (!d.nationality) return { ok: false, msg: 'Selecione sua nacionalidade.' };
      if (!d.otherNationality) return { ok: false, msg: 'Informe se possui outra nacionalidade.' };
      if (d.otherNationality === 'sim' && (!d.otherNationalities || d.otherNationalities.length === 0))
        return { ok: false, msg: 'Adicione ao menos uma outra nacionalidade.' };
      if (!d.residence) return { ok: false, msg: 'Selecione o país de residência atual.' };
      return { ok: true };

    case 2:
      if (!d.docType) return { ok: false, msg: 'Selecione o documento de identificação.' };
      if (!d.docNumber || d.docNumber.length < 4) return { ok: false, msg: 'Informe o número do documento.' };
      if (!d.docName || d.docName.trim().length < 5) return { ok: false, msg: 'Informe o nome conforme o documento.' };
      {
        const br = d.nationality === 'BR' || d.residence === 'BR';
        if (br && d.docType !== 'CPF' && !validCPF(d.cpf))
          return { ok: false, msg: 'Informe um CPF válido.' };
        if (d.docType === 'CPF' && !validCPF(d.docNumber))
          return { ok: false, msg: 'Informe um CPF válido.' };
      }
      return { ok: true };

    case 3:
      if (!d.fullName || d.fullName.trim().split(' ').length < 2)
        return { ok: false, msg: 'Informe o nome completo.' };
      if (!d.birthDate) return { ok: false, msg: 'Informe a data de nascimento.' };
      {
        const a = calcAge(d.birthDate);
        if (a < 0) return { ok: false, msg: 'Data de nascimento inválida.' };
        if (a < 18) return { ok: false, msg: 'Cadastro de menor de idade segue fluxo próprio com responsável legal.' };
        if (a > 120) return { ok: false, msg: 'Data de nascimento inválida.' };
      }
      if (!d.sex) return { ok: false, msg: 'Selecione a opção de sexo para fins cadastrais.' };
      if (!d.maritalStatus) return { ok: false, msg: 'Selecione o estado civil.' };
      if (!d.motherName || d.motherName.trim().length < 3) return { ok: false, msg: 'Informe o nome da mãe.' };
      if (!d.birthCountry) return { ok: false, msg: 'Selecione o país de nascimento.' };
      return { ok: true };

    case 4:
      if (!d.addr.country) return { ok: false, msg: 'Selecione o país do endereço.' };
      if (!d.addr.zip) return { ok: false, msg: 'Informe o CEP ou código postal.' };
      if (!d.addr.state) return { ok: false, msg: 'Informe o estado ou província.' };
      if (!d.addr.city) return { ok: false, msg: 'Informe a cidade.' };
      if (!d.addr.district) return { ok: false, msg: 'Informe o bairro ou distrito.' };
      if (!d.addr.street) return { ok: false, msg: 'Informe a rua ou avenida.' };
      if (!d.addr.number) return { ok: false, msg: 'Informe o número do endereço.' };
      if (!d.addr.type) return { ok: false, msg: 'Selecione o tipo de residência.' };
      return { ok: true };

    case 5:
      if (!d.phone.dial || !d.phone.ddd || !d.phone.number)
        return { ok: false, msg: 'Preencha código internacional, DDD e número.' };
      if (!d.phone.verified) return { ok: false, msg: 'Confirme o código enviado ao telefone.' };
      if (!validEmail(d.email.value)) return { ok: false, msg: 'Informe um e-mail válido.' };
      if (!d.email.verified) return { ok: false, msg: 'Confirme o código enviado ao e-mail.' };
      return { ok: true };

    case 6:
      if (!d.profession && !(d.professionOther && d.professionOther.trim()))
        return { ok: false, msg: 'Selecione ou informe sua profissão.' };
      if (!d.situation) return { ok: false, msg: 'Selecione sua situação profissional.' };
      return { ok: true };

    case 7:
      if (!d.income) return { ok: false, msg: 'Selecione a faixa de renda mensal.' };
      return { ok: true };

    case 8:
      if (!d.extraIncome) return { ok: false, msg: 'Informe se possui outra fonte de renda.' };
      if (d.extraIncome === 'sim'){
        if (!d.extraSources || d.extraSources.length === 0)
          return { ok: false, msg: 'Selecione ao menos uma fonte de renda extra.' };
        if (!d.extraValue) return { ok: false, msg: 'Selecione o valor aproximado da renda extra.' };
      }
      return { ok: true };

    case 9:
      if (!d.patrimony) return { ok: false, msg: 'Responda sobre a existência de patrimônio.' };
      if (d.patrimony === 'sim' && !d.patrimonyRange)
        return { ok: false, msg: 'Selecione a faixa aproximada do patrimônio.' };
      return { ok: true };

    case 10:
      if (!d.idv.front) return { ok: false, msg: 'Registre a frente do documento.' };
      if (!d.idv.face) return { ok: false, msg: 'Realize o reconhecimento facial.' };
      if (!d.idv.live) return { ok: false, msg: 'Realize a prova de vida.' };
      return { ok: true };

    case 11:
      if (!d.pep) return { ok: false, msg: 'Responda à pergunta sobre PEP.' };
      if (!d.pepRelated) return { ok: false, msg: 'Responda à pergunta sobre relação com PEP.' };
      if (!d.purpose || d.purpose.length === 0) return { ok: false, msg: 'Selecione a finalidade principal da conta.' };
      if (!d.movement) return { ok: false, msg: 'Selecione a movimentação mensal esperada.' };
      return { ok: true };

    case 12: {
      const v = d.password || '';
      if (v.length < 8) return { ok: false, msg: 'A senha precisa ter no mínimo 8 caracteres.' };
      if (!/[A-Z]/.test(v) || !/[a-z]/.test(v) || !/\d/.test(v) || !/[^A-Za-z0-9]/.test(v))
        return { ok: false, msg: 'A senha precisa conter maiúscula, minúscula, número e caractere especial.' };
      if (v !== d.passwordConfirm) return { ok: false, msg: 'A confirmação da senha não confere.' };
      return { ok: true };
    }

    case 13: return { ok: true };

    case 14: {
      const c = d.contracts;
      if (!c.account || !c.terms || !c.privacy || !c.fees)
        return { ok: false, msg: 'É necessário aceitar todos os documentos para enviar.' };
      return { ok: true };
    }

    default: return { ok: true };
  }
}

function submitRequest(){
  state.data.protocol = 'AU' + Date.now().toString().slice(-9);
  state.step = 15;
  save(); render(true);
}

   INIT

load();
render(true);
