<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora — Abertura de Conta</title>
<style>
  :root{
    --bg:#070A10;
    --card:rgba(17,23,34,.78);
    --line:rgba(255,255,255,.09);
    --line-strong:rgba(255,255,255,.18);
    --text:#E8EDF5;
    --muted:#8FA3BF;
    --accent:#5EEAD4;
    --accent2:#38BDF8;
    --danger:#F87171;
    --radius:14px;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
    color-scheme:dark;
    overflow-x:hidden;
  }

  /* ---------- fundo animado ---------- */
  .bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.34;animation:float 20s ease-in-out infinite}
  .b1{width:520px;height:520px;background:#157F6E;top:-180px;left:-140px}
  .b2{width:480px;height:480px;background:#2B4C8C;bottom:-180px;right:-150px;animation-delay:-7s}
  .b3{width:400px;height:400px;background:#6B4B9E;top:38%;left:58%;animation-delay:-13s;opacity:.22}
  @keyframes float{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(28px,-42px,0) scale(1.14)}
  }

  #app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

  /* ---------- layout ---------- */
  .shell{width:100%;max-width:460px;margin:0 auto;padding:22px 18px 40px;flex:1;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{
    width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#04121A;font-weight:800;font-size:15px;letter-spacing:-.02em;
  }
  .brand-name{font-weight:700;letter-spacing:.24em;font-size:12px;color:#CBD8EA}

  .progress{margin-bottom:16px}
  .progress-label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .progress-track{height:3px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .progress-track span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .45s cubic-bezier(.4,0,.2,1)}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:22px;
    padding:26px 20px 22px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 26px 70px rgba(0,0,0,.5);
  }
  .step{animation:fadeUp .45s cubic-bezier(.22,.8,.3,1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

  .foot{margin-top:20px;text-align:center;font-size:11px;color:#5F718B;line-height:1.6}

  /* ---------- tipografia ---------- */
  .eyebrow{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
  h2{font-size:21px;line-height:1.28}
  .sub{margin:8px 0 0;color:var(--muted);font-size:13.5px;line-height:1.55}
  .step-head{margin-bottom:20px}
  .label{display:block;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;font-weight:600}
  .hint{font-size:12px;color:#6F86A3;margin-top:8px;line-height:1.5}
  .warn{font-size:12.5px;color:#FCA5A5;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);border-radius:12px;padding:11px 13px;margin-top:12px;line-height:1.5}

  /* ---------- formulários ---------- */
  .field{margin-bottom:20px}
  .input,select.input{
    width:100%;padding:13px 14px;border-radius:12px;
    background:rgba(255,255,255,.045);
    border:1px solid var(--line-strong);
    color:var(--text);font-size:15px;font-family:inherit;
    outline:none;transition:border-color .2s,background .2s;
    appearance:none;
  }
  select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 21px,calc(100% - 14px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
  .input::placeholder{color:#5C6E88}
  .input:focus{border-color:rgba(94,234,212,.6);background:rgba(94,234,212,.05)}
  .input:disabled{opacity:.5}

  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}

  .options{display:flex;flex-wrap:wrap;gap:8px}
  .options.col{flex-direction:column}
  .opt{
    flex:1 1 auto;min-width:calc(50% - 4px);
    padding:12px 14px;border-radius:12px;text-align:left;
    background:rgba(255,255,255,.035);
    border:1px solid var(--line-strong);
    color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;
    transition:border-color .18s,background .18s,transform .12s;
  }
  .opt:active{transform:scale(.985)}
  .opt.selected{border-color:var(--accent);background:rgba(94,234,212,.1);color:#D8FFF7}

  .list{
    max-height:190px;overflow-y:auto;margin-top:10px;
    border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.22);
  }
  .list::-webkit-scrollbar{width:5px}
  .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}
  .list-item{
    display:block;width:100%;text-align:left;padding:11px 14px;
    background:none;border:0;border-bottom:1px solid rgba(255,255,255,.05);
    color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;
  }
  .list-item:last-child{border-bottom:0}
  .list-item:hover,.list-item:active{background:rgba(94,234,212,.09)}
  .empty{padding:14px;color:var(--muted);font-size:13px;text-align:center}

  .chip{
    display:inline-flex;align-items:center;gap:8px;
    padding:8px 13px;border-radius:99px;font-size:13px;
    background:rgba(94,234,212,.12);border:1px solid rgba(94,234,212,.38);color:#C7FFF6;
  }
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .selection{margin-top:10px;min-height:0}
  .chip button{background:none;border:0;color:#7FE9D8;cursor:pointer;font-size:14px;padding:0 0 0 2px;font-family:inherit}

  /* ---------- botões ---------- */
  .btn{
    display:block;width:100%;padding:15px 18px;border-radius:13px;
    font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.09em;
    cursor:pointer;border:1px solid transparent;transition:transform .12s,filter .2s,background .2s;
  }
  .btn:active{transform:scale(.985)}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04121A}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;border-color:var(--line-strong);color:var(--text)}
  .btn-ghost:hover{background:rgba(255,255,255,.05)}
  .btn+.btn{margin-top:10px}
  .nav{display:flex;gap:10px;margin-top:26px}
  .nav .btn{margin-top:0}
  .nav .btn-ghost{flex:0 0 34%}
  .link{
    background:none;border:0;padding:0;color:var(--accent);font-family:inherit;
    font-size:12px;letter-spacing:.09em;font-weight:600;cursor:pointer;text-transform:uppercase;
  }
  .link.center{display:block;width:100%;text-align:center;margin-top:18px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--muted)}
  .link.center:hover{color:var(--text)}

  /* ---------- tela inicial ---------- */
  .hero{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 24px;max-width:460px;margin:0 auto;width:100%;
  }
  .brand-mark.big{width:76px;height:76px;border-radius:24px;font-size:34px;box-shadow:0 18px 50px rgba(94,234,212,.28);animation:pop .7s cubic-bezier(.22,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:scale(.72)}to{opacity:1;transform:scale(1)}}
  .hero-name{margin-top:22px;font-size:26px;letter-spacing:.34em;font-weight:700;animation:fadeUp .6s .1s both}
  .hero-tag{margin:14px 0 0;font-size:15.5px;color:#C3D2E6;animation:fadeUp .6s .2s both}
  .hero-rotate{margin:10px 0 0;font-size:13px;color:var(--muted);min-height:20px;transition:opacity .4s;animation:fadeUp .6s .3s both}
  .hero-actions{width:100%;margin-top:38px;animation:fadeUp .6s .4s both}
  .about{
    width:100%;margin-top:22px;text-align:left;padding:16px 18px;border-radius:16px;
    background:rgba(255,255,255,.035);border:1px solid var(--line);
    font-size:13px;color:#A9BBD2;line-height:1.65;
  }
  .about strong{color:var(--text);display:block;margin-bottom:6px;font-size:13px;letter-spacing:.04em}

  /* ---------- revisão ---------- */
  .review-block{border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:12px;background:rgba(255,255,255,.022)}
  .review-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
  .review-head>span{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .review-row{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:13px}
  .review-row .rk{color:var(--muted);flex:0 0 42%}
  .review-row .rv{text-align:right;color:var(--text);word-break:break-word}

  /* ---------- contratos ---------- */
  .contract{border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .contract-head{padding:12px 15px;font-size:13px;font-weight:600;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03)}
  .contract-body{max-height:130px;overflow-y:auto;padding:13px 15px;font-size:12.5px;color:#9FB2CA;line-height:1.65}
  .contract-body::-webkit-scrollbar{width:5px}
  .contract-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:99px}
  .contract-body p{margin:0 0 9px}
  .contract-body p:last-child{margin-bottom:0}
  .contract-check{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
  .contract-check input{
    appearance:none;width:19px;height:19px;flex:0 0 19px;margin-top:1px;
    border:1px solid var(--line-strong);border-radius:6px;background:rgba(255,255,255,.05);
    cursor:pointer;position:relative;transition:.18s;
  }
  .contract-check input:checked{background:var(--accent);border-color:var(--accent)}
  .contract-check input:checked::after{
    content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
    border:solid #04121A;border-width:0 2px 2px 0;transform:rotate(45deg);
  }
  .contract-check span{color:#B9C8DC;line-height:1.5}

  /* ---------- força de senha ---------- */
  .strength{display:flex;gap:5px;margin-top:11px}
  .strength span{height:3px;flex:1;border-radius:99px;background:rgba(255,255,255,.1);transition:background .3s}
  .strength.s1 span:nth-child(1){background:#F87171}
  .strength.s2 span:nth-child(-n+2){background:#FBBF24}
  .strength.s3 span:nth-child(-n+3){background:#34D399}
  .strength.s4 span{background:var(--accent)}
  .reqs{margin-top:11px;font-size:12px;color:var(--muted);line-height:1.9}
  .reqs .ok{color:#5EEAD4}

  /* ---------- linha do tempo ---------- */
  .timeline{margin:22px 0 0}
  .tl-item{
    position:relative;padding:0 0 22px 26px;font-size:14px;color:#647991;transition:color .4s;
  }
  .tl-item::before{
    content:"";position:absolute;left:0;top:5px;width:11px;height:11px;border-radius:50%;
    border:2px solid #2C3A4E;background:transparent;transition:.4s;
  }
  .tl-item::after{content:"";position:absolute;left:5px;top:19px;bottom:0;width:1px;background:#1E2A3A}
  .tl-item:last-child::after{display:none}
  .tl-item.done{color:var(--text)}
  .tl-item.done::before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 14px rgba(94,234,212,.6)}
  .tl-item.current{color:var(--accent)}
  .tl-item.current::before{border-color:var(--accent);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(94,234,212,.5)}50%{box-shadow:0 0 0 8px rgba(94,234,212,0)}}

  .capture-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;margin-bottom:10px;background:rgba(255,255,255,.02)}
  .capture-row .ct{font-size:13.5px}
  .capture-row .cs{font-size:11.5px;color:var(--muted);margin-top:3px}
  .capture-btn{
    padding:9px 14px;border-radius:9px;font-size:11px;letter-spacing:.09em;font-weight:700;
    background:rgba(255,255,255,.06);border:1px solid var(--line-strong);color:var(--text);
    font-family:inherit;cursor:pointer;white-space:nowrap;flex:0 0 auto;
  }
  .capture-btn.done{background:rgba(94,234,212,.16);border-color:var(--accent);color:#B9FFF4}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);
    background:#101A27;border:1px solid var(--line-strong);color:var(--text);
    padding:13px 20px;border-radius:12px;font-size:13px;max-width:88vw;text-align:center;
    opacity:0;pointer-events:none;transition:.3s;z-index:50;box-shadow:0 18px 40px rgba(0,0,0,.55);
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  [hidden]{display:none !important}
</style>
</head>

/* =========================================================

/* ---------- utilitários ---------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
));

const norm = s => (s || '').toString().toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '');

function getPath(obj, path){
  return path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
}
function setPath(obj, path, value){
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++){
    if (typeof o[parts[i]] !== 'object' || o[parts[i]] === null) o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = value;
}

let COUNTRIES = COUNTRIES_RAW.trim().split('\n').map(line => {
  const [n, c, d] = line.split('|');
  return { n, c, d };
}).sort((a, b) => a.n.localeCompare(b.n, 'pt-BR'));

/* API gratuita de países (RestCountries) — atualiza o catálogo local */
(async function loadCountriesAPI(){
  try{
    const res = await fetch('https://restcountries.com/v3.1/all?fields=name,translations,cca2,idd');
    if (!res.ok) return;
    const json = await res.json();
    const list = json.map(c => {
      const name = (c.translations && c.translations.por && c.translations.por.common) || c.name.common;
      const dial = c.idd && c.idd.root ? (c.idd.root + ((c.idd.suffixes && c.idd.suffixes[0]) || '')).replace('+', '') : '';
      return { n: name, c: c.cca2, d: dial };
    }).filter(x => x.c && x.n);
    if (list.length > 150){
      COUNTRIES = list.sort((a, b) => a.n.localeCompare(b.n, 'pt-BR'));
    }
  }catch(e){ /* mantém catálogo local */ }
})();

function countryName(iso){
  const c = COUNTRIES.find(x => x.c === iso);
  return c ? c.n : iso;
}
function countryDial(iso){
  const c = COUNTRIES.find(x => x.c === iso);
  return c ? c.d : '';
}

/* ---------- validações ---------- */
function validCPF(cpf){
  cpf = (cpf || '').replace(/\D/g, '');
  if (cpf.length !== 11 || /^(\d)\1{10}$/.test(cpf)) return false;
  let s = 0;
  for (let i = 0; i < 9; i++) s += parseInt(cpf[i]) * (10 - i);
  let d1 = (s * 10) % 11; if (d1 === 10) d1 = 0;
  if (d1 !== parseInt(cpf[9])) return false;
  s = 0;
  for (let i = 0; i < 10; i++) s += parseInt(cpf[i]) * (11 - i);
  let d2 = (s * 10) % 11; if (d2 === 10) d2 = 0;
  return d2 === parseInt(cpf[10]);
}
function calcAge(dateStr){
  if (!dateStr) return -1;
  const b = new Date(dateStr + 'T00:00:00');
  if (isNaN(b.getTime())) return -1;
  const t = new Date();
  let a = t.getFullYear() - b.getFullYear();
  const m = t.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < b.getDate())) a--;
  return a;
}
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test((v || '').trim()); }

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    const merged = JSON.parse(JSON.stringify(DEFAULT_DATA));
    const src = parsed.data || {};
    for (const k in merged){
      if (src[k] === undefined) continue;
      if (typeof merged[k] === 'object' && merged[k] !== null && !Array.isArray(merged[k])){
        merged[k] = Object.assign({}, merged[k], src[k]);
      } else {
        merged[k] = src[k];
      }
    }
    state = { step: typeof parsed.step === 'number' ? parsed.step : 0, data: merged };
  }catch(e){}
}
function resetAll(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  state = { step: 0, data: JSON.parse(JSON.stringify(DEFAULT_DATA)) };
  render(true);
}

function optGroup(group, items, current, extraClass){
  return `<div class="options ${extraClass || ''}" data-group="${group}">` + items.map(it => {
    const v = typeof it === 'string' ? it : it.v;
    const l = typeof it === 'string' ? it : it.l;
    const sel = String(current) === String(v) ? 'selected' : '';
    return `<button type="button" class="opt ${sel}" data-value="${esc(v)}">${esc(l)}</button>`;
  }).join('') + `</div>`;
}

function multiGroup(group, items, current){
  const cur = current || [];
  return `<div class="options" data-multi="${group}">` + items.map(it => {
    const v = typeof it === 'string' ? it : it.v;
    const l = typeof it === 'string' ? it : it.l;
    const sel = cur.includes(v) ? 'selected' : '';
    return `<button type="button" class="opt ${sel}" data-value="${esc(v)}">${esc(l)}</button>`;
  }).join('') + `</div>`;
}

function countrySelectOptions(selected){
  return `<option value="">Selecione</option>` + COUNTRIES.map(c =>
    `<option value="${c.c}" ${c.c === selected ? 'selected' : ''}>${esc(c.n)}</option>`
  ).join('');
}

function chipCountry(iso){
  return iso ? `<span class="chip">${esc(countryName(iso))}</span>` : '';
}

function renderCountryList(container, query, onPick, limit){
  if (!container) return;
  const q = norm(query);
  const items = COUNTRIES.filter(c => !q || norm(c.n).includes(q)).slice(0, limit || 80);
  container.innerHTML = items.length
    ? items.map(c => `<button type="button" class="list-item" data-iso="${c.c}">${esc(c.n)}</button>`).join('')
    : '<div class="empty">Nenhum resultado encontrado</div>';
  $$('[data-iso]', container).forEach(btn => {
    btn.onclick = () => onPick(btn.dataset.iso);
  });
}

  if (open) open.onclick = () => {
    if (state.step === 0) state.step = 1;

function bindStatus(){
  const items = $$('#timeline .tl-item');
  let i = 0;
  const run = () => {
    if (i >= items.length){
      const note = document.getElementById('statusNote');
      if (note) note.hidden = false;
      return;
    }
    items[i].classList.add('current');
    setTimeout(() => {
      items[i].classList.remove('current');
      items[i].classList.add('done');
      i++;
      run();
    }, 1100);
  };
  setTimeout(run, 400);

  const home = document.getElementById('btnHome');
  if (home) home.onclick = () => {
    state.step = 0;
    save();
    render(true);
  };

  const cancel = document.getElementById('btnCancel');
  if (cancel) cancel.onclick = () => {
    if (confirm('Deseja cancelar a solicitação e apagar os dados preenchidos?')){
      resetAll();
    }
  };
}

/* =========================================================
   BINDINGS
   ========================================================= */

function bindCommon(){
  // campos com data-bind
  $$('[data-bind]').forEach(inp => {
    const p = inp.dataset.bind;
    const v = getPath(state.data, p);
    if (inp.type === 'checkbox'){
      inp.checked = !!v;
    } else if (v !== undefined && v !== null && document.activeElement !== inp){
      inp.value = v;
    }
    const handler = () => {
      const value = inp.type === 'checkbox' ? inp.checked : inp.value;
      setPath(state.data, p, value);
      save();
      if (typeof syncAll === 'function') syncAll();
    };
    inp.addEventListener('input', handler);
    inp.addEventListener('change', handler);
  });

  bindOptions();

  // navegação
  const back = document.getElementById('btnBack');
  if (back) back.onclick = () => {
    if (state.step <= 1) { state.step = 0; save(); render(true); return; }
    go(state.step - 1);
  };

  const next = document.getElementById('btnNext');
  if (next) next.onclick = () => {
    const res = validateStep(state.step);
    if (!res.ok){ toast(res.msg); return; }
    if (state.step === 14){ submitRequest(); return; }
    go(state.step + 1);
  };

  const exit = document.getElementById('btnExit');
  if (exit) exit.onclick = () => {
    state.step = 0;
    save();
    render(true);
  };

  // botões de edição na revisão
  $$('[data-goto]').forEach(btn => {
    btn.onclick = () => go(parseInt(btn.dataset.goto, 10));
  });
}

function bindOptions(){
  $$('.options[data-group]').forEach(box => {
    const g = box.dataset.group;
    const refresh = () => {
      const cur = String(getPath(state.data, g));
      $$('.opt', box).forEach(b => b.classList.toggle('selected', cur === b.dataset.value));
    };
    refresh();
    $$('.opt', box).forEach(btn => {
      btn.onclick = () => {
        setPath(state.data, g, btn.dataset.value);
        save();
        refresh();
        syncAll();
      };
    });
  });

  $$('.options[data-multi]').forEach(box => {
    const g = box.dataset.multi;
    const refresh = () => {
      const cur = getPath(state.data, g) || [];
      $$('.opt', box).forEach(b => b.classList.toggle('selected', cur.includes(b.dataset.value)));
    };
    refresh();
    $$('.opt', box).forEach(btn => {
      btn.onclick = () => {
        const cur = (getPath(state.data, g) || []).slice();
        const i = cur.indexOf(btn.dataset.value);
        if (i >= 0) cur.splice(i, 1); else cur.push(btn.dataset.value);
        setPath(state.data, g, cur);
        save();
        refresh();
        syncAll();
      };
    });
  });
}

/* ---------- bindings específicos por etapa ---------- */
function bindStep(){
  const d = state.data;

  switch (state.step){

    /* ETAPA 1 */
    case 1: {
      const natSearch = document.getElementById('natSearch');
      const natList = document.getElementById('natList');
      const resSearch = document.getElementById('resSearch');
      const resList = document.getElementById('resList');
      const otherSearch = document.getElementById('otherSearch');
      const otherList = document.getElementById('otherList');

      renderCountryList(natList, '', iso => { d.nationality = iso; save(); rerender(); });
      natSearch.oninput = () => renderCountryList(natList, natSearch.value, iso => { d.nationality = iso; save(); rerender(); });

      renderCountryList(resList, '', iso => { d.residence = iso; save(); rerender(); });
      resSearch.oninput = () => renderCountryList(resList, resSearch.value, iso => { d.residence = iso; save(); rerender(); });

      renderCountryList(otherList, '', iso => {
        if (iso === d.nationality) { toast('A nacionalidade principal já foi informada.'); return; }
        if (!d.otherNationalities.includes(iso)) d.otherNationalities.push(iso);
        save(); rerender();
      });
      otherSearch.oninput = () => renderCountryList(otherList, otherSearch.value, iso => {
        if (iso === d.nationality) { toast('A nacionalidade principal já foi informada.'); return; }
        if (!d.otherNationalities.includes(iso)) d.otherNationalities.push(iso);
        save(); rerender();
      });

      $$('[data-remove]').forEach(btn => {
        btn.onclick = () => {
          d.otherNationalities = d.otherNationalities.filter(x => x !== btn.dataset.remove);
          save(); rerender();
        };
      });

      syncAll = () => {
        const box = document.getElementById('otherBox');
        if (box) box.hidden = d.otherNationality !== 'sim';
      };
      break;
    }

    /* ETAPA 2 */
    case 2: {
      syncAll = () => {
        const box = document.getElementById('cpfBox');
        if (!box) return;
        const br = d.nationality === 'BR' || d.residence === 'BR';
        box.hidden = !(br && d.docType !== 'CPF');
      };
      break;
    }

    /* ETAPA 3 */
    case 3: {
      const birth = document.getElementById('birthDate');
      syncAll = () => {
        const warn = document.getElementById('minorWarn');
        if (!warn) return;
        const a = calcAge(d.birthDate);
        warn.hidden = !(a >= 0 && a < 18);
      };
      if (birth) birth.addEventListener('change', syncAll);
      break;
    }

    /* ETAPA 5 */
    case 5: {
      const sendPhone = document.getElementById('btnSendPhone');
      if (sendPhone) sendPhone.onclick = () => {
        if (!d.phone.ddd || !d.phone.number){ toast('Informe DDD e número do celular.'); return; }
        d.phone.sentCode = String(Math.floor(100000 + Math.random() * 900000));
        d.phone.verified = false;
        save();
        toast('Código simulado enviado por SMS: ' + d.phone.sentCode);
        rerender();
      };

      const confirmPhone = document.getElementById('btnConfirmPhone');
      if (confirmPhone) confirmPhone.onclick = () => {
        if (d.phone.code === d.phone.sentCode && d.phone.sentCode){
          d.phone.verified = true;
          save();
          toast('Telefone verificado.');
        } else {
          toast('Código incorreto.');
        }
        rerender();
      };

      const sendEmail = document.getElementById('btnSendEmail');
      if (sendEmail) sendEmail.onclick = () => {
        if (!validEmail(d.email.value)){ toast('Informe um e-mail válido.'); return; }
        d.email.sentCode = String(Math.floor(100000 + Math.random() * 900000));
        d.email.verified = false;
        save();
        toast('Código simulado enviado por e-mail: ' + d.email.sentCode);
        rerender();
      };

      const confirmEmail = document.getElementById('btnConfirmEmail');
      if (confirmEmail) confirmEmail.onclick = () => {
        if (d.email.code === d.email.sentCode && d.email.sentCode){
          d.email.verified = true;
          save();
          toast('E-mail verificado.');
        } else {
          toast('Código incorreto.');
        }
        rerender();
      };

      syncAll = () => {};
      break;
    }

    /* ETAPA 6 */
    case 6: {
      const search = document.getElementById('profSearch');
      const list = document.getElementById('profList');
      const otherBox = document.getElementById('otherProfBox');
      if (otherBox) otherBox.hidden = !d.professionOther;

      const renderList = (q) => {
        const query = norm(q);
        const items = PROFESSIONS.filter(p => !query || norm(p).includes(query)).slice(0, 200);
        list.innerHTML = items.length
          ? items.map(p => `<button type="button" class="list-item" data-prof="${esc(p)}">${esc(p)}</button>`).join('')
          : '<div class="empty">Nenhuma profissão encontrada. Use a opção abaixo.</div>';
        $$('[data-prof]', list).forEach(btn => {
          btn.onclick = () => {
            d.profession = btn.dataset.prof;
            d.professionOther = '';
            save();
            rerender();
          };
        });
      };
      renderList('');
      search.oninput = () => renderList(search.value);

      const otherBtn = document.getElementById('btnOtherProf');
      if (otherBtn) otherBtn.onclick = () => {
        const box = document.getElementById('otherProfBox');
        box.hidden = !box.hidden;
        if (!box.hidden) setTimeout(() => $('[data-bind="professionOther"]', box).focus(), 60);
      };

      const clearProf = document.getElementById('clearProf');
      if (clearProf) clearProf.onclick = () => { d.profession = ''; save(); rerender(); };

      const clearOther = document.getElementById('clearProfOther');
      if (clearOther) clearOther.onclick = () => { d.professionOther = ''; save(); rerender(); };

      syncAll = () => {};
      break;
    }

    /* ETAPA 8 */
    case 8: {
      syncAll = () => {
        const box = document.getElementById('extraBox');
        if (box) box.hidden = d.extraIncome !== 'sim';
      };
      break;
    }

    /* ETAPA 9 */
    case 9: {
      syncAll = () => {
        const box = document.getElementById('patrimonyBox');
        if (box) box.hidden = d.patrimony !== 'sim';
      };
      break;
    }

    /* ETAPA 10 */
    case 10: {
      $$('[data-capture]').forEach(btn => {
        btn.onclick = () => {
          const key = btn.dataset.capture;
          d.idv[key] = !d.idv[key];
          save();
          rerender();
        };
      });
      syncAll = () => {};
      break;
    }

    /* ETAPA 12 */
    case 12: {
      const pwd = document.getElementById('pwd');
      const pwd2 = document.getElementById('pwd2');
      const bar = document.getElementById('strength');
      const reqs = document.getElementById('reqs');
      const show = document.getElementById('showPwd');

      const evaluate = () => {
        const v = pwd.value || '';
        const checks = {
          len: v.length >= 8,
          upper: /[A-Z]/.test(v),
          lower: /[a-z]/.test(v),
          digit: /\d/.test(v),
          special: /[^A-Za-z0-9]/.test(v)
        };
        let score = 0;
        Object.keys(checks).forEach(k => {
          const el = reqs.querySelector(`[data-req="${k}"]`);
          if (el) el.classList.toggle('ok', checks[k]);
          if (checks[k]) score++;
        });
        bar.className = 'strength s' + Math.min(score, 4);
      };

      if (pwd) pwd.addEventListener('input', evaluate);
      evaluate();

      if (show) show.addEventListener('change', () => {
        const t = show.checked ? 'text' : 'password';
        if (pwd) pwd.type = t;
        if (pwd2) pwd2.type = t;
      });

      syncAll = () => {};
      break;
    }
  }
}

/* =========================================================
   VALIDAÇÃO POR ETAPA
   ========================================================= */
function validateStep(step){
  const d = state.data;

  switch (step){
    case 1:
      if (!d.nationality) return { ok: false, msg: 'Selecione sua nacionalidade.' };
      if (!d.otherNationality) return { ok: false, msg: 'Informe se possui outra nacionalidade.' };
      if (d.otherNationality === 'sim' && (!d.otherNationalities || d.otherNationalities.length === 0))
        return { ok: false, msg: 'Adicione ao menos uma outra nacionalidade.' };
      if (!d.residence) return { ok: false, msg: 'Selecione o país de residência atual.' };
      return { ok: true };

    case 2:
      if (!d.docType) return { ok: false, msg: 'Selecione o documento de identificação.' };
      if (!d.docNumber || d.docNumber.length < 4) return { ok: false, msg: 'Informe o número do documento.' };
      if (!d.docName || d.docName.trim().length < 5) return { ok: false, msg: 'Informe o nome conforme o documento.' };
      {
        const br = d.nationality === 'BR' || d.residence === 'BR';
        if (br && d.docType !== 'CPF' && !validCPF(d.cpf))
          return { ok: false, msg: 'Informe um CPF válido.' };
        if (d.docType === 'CPF' && !validCPF(d.docNumber))
          return { ok: false, msg: 'Informe um CPF válido.' };
      }
      return { ok: true };

    case 3:
      if (!d.fullName || d.fullName.trim().split(' ').length < 2)
        return { ok: false, msg: 'Informe o nome completo.' };
      if (!d.birthDate) return { ok: false, msg: 'Informe a data de nascimento.' };
      {
        const a = calcAge(d.birthDate);
        if (a < 0) return { ok: false, msg: 'Data de nascimento inválida.' };
        if (a < 18) return { ok: false, msg: 'Cadastro de menor de idade segue fluxo próprio com responsável legal.' };
        if (a > 120) return { ok: false, msg: 'Data de nascimento inválida.' };
      }
      if (!d.sex) return { ok: false, msg: 'Selecione a opção de sexo para fins cadastrais.' };
      if (!d.maritalStatus) return { ok: false, msg: 'Selecione o estado civil.' };
      if (!d.motherName || d.motherName.trim().length < 3) return { ok: false, msg: 'Informe o nome da mãe.' };
      if (!d.birthCountry) return { ok: false, msg: 'Selecione o país de nascimento.' };
      return { ok: true };

    case 4:
      if (!d.addr.country) return { ok: false, msg: 'Selecione o país do endereço.' };
      if (!d.addr.zip) return { ok: false, msg: 'Informe o CEP ou código postal.' };
      if (!d.addr.state) return { ok: false, msg: 'Informe o estado ou província.' };
      if (!d.addr.city) return { ok: false, msg: 'Informe a cidade.' };
      if (!d.addr.district) return { ok: false, msg: 'Informe o bairro ou distrito.' };
      if (!d.addr.street) return { ok: false, msg: 'Informe a rua ou avenida.' };
      if (!d.addr.number) return { ok: false, msg: 'Informe o número do endereço.' };
      if (!d.addr.type) return { ok: false, msg: 'Selecione o tipo de residência.' };
      return { ok: true };

    case 5:
      if (!d.phone.dial || !d.phone.ddd || !d.phone.number)
        return { ok: false, msg: 'Preencha código internacional, DDD e número.' };
      if (!d.phone.verified) return { ok: false, msg: 'Confirme o código enviado ao telefone.' };
      if (!validEmail(d.email.value)) return { ok: false, msg: 'Informe um e-mail válido.' };
      if (!d.email.verified) return { ok: false, msg: 'Confirme o código enviado ao e-mail.' };
      return { ok: true };

    case 6:
      if (!d.profession && !(d.professionOther && d.professionOther.trim()))
        return { ok: false, msg: 'Selecione ou informe sua profissão.' };
      if (!d.situation) return { ok: false, msg: 'Selecione sua situação profissional.' };
      return { ok: true };

    case 7:
      if (!d.income) return { ok: false, msg: 'Selecione a faixa de renda mensal.' };
      return { ok: true };

    case 8:
      if (!d.extraIncome) return { ok: false, msg: 'Informe se possui outra fonte de renda.' };
      if (d.extraIncome === 'sim'){
        if (!d.extraSources || d.extraSources.length === 0)
          return { ok: false, msg: 'Selecione ao menos uma fonte de renda extra.' };
        if (!d.extraValue) return { ok: false, msg: 'Selecione o valor aproximado da renda extra.' };
      }
      return { ok: true };

    case 9:
      if (!d.patrimony) return { ok: false, msg: 'Responda sobre a existência de patrimônio.' };
      if (d.patrimony === 'sim' && !d.patrimonyRange)
        return { ok: false, msg: 'Selecione a faixa aproximada do patrimônio.' };
      return { ok: true };

    case 10:
      if (!d.idv.front) return { ok: false, msg: 'Registre a frente do documento.' };
      if (!d.idv.face) return { ok: false, msg: 'Realize o reconhecimento facial.' };
      if (!d.idv.live) return { ok: false, msg: 'Realize a prova de vida.' };
      return { ok: true };

    case 11:
      if (!d.pep) return { ok: false, msg: 'Responda à pergunta sobre PEP.' };
      if (!d.pepRelated) return { ok: false, msg: 'Responda à pergunta sobre relação com PEP.' };
      if (!d.purpose || d.purpose.length === 0) return { ok: false, msg: 'Selecione a finalidade principal da conta.' };
      if (!d.movement) return { ok: false, msg: 'Selecione a movimentação mensal esperada.' };
      return { ok: true };

    case 12: {
      const v = d.password || '';
      if (v.length < 8) return { ok: false, msg: 'A senha precisa ter no mínimo 8 caracteres.' };
      if (!/[A-Z]/.test(v) || !/[a-z]/.test(v) || !/\d/.test(v) || !/[^A-Za-z0-9]/.test(v))
        return { ok: false, msg: 'A senha precisa conter maiúscula, minúscula, número e caractere especial.' };
      if (v !== d.passwordConfirm) return { ok: false, msg: 'A confirmação da senha não confere.' };
      return { ok: true };
    }

    case 13:
      return { ok: true };

    case 14: {
      const c = d.contracts;
      if (!c.account || !c.terms || !c.privacy || !c.fees)
        return { ok: false, msg: 'É necessário aceitar todos os documentos para enviar.' };
      return { ok: true };
    }

    default:
      return { ok: true };
  }
}

/* ---------- envio da solicitação ---------- */
function submitRequest(){
  const d = state.data;
  d.protocol = 'AU' + Date.now().toString().slice(-9);
  save();
  state.step = 15;
  save();
  render(true);
}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
load();
render(true);
</script>
