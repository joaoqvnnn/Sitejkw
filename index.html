<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aurora - Abertura de Conta</title>
<style>
  /* =========================================================
     DESIGN SYSTEM - PADRÃO FINTECH (DARK MODE)
     ========================================================= */
  :root {
    --bg: #000000;
    --bg-input: #1C1C1E;
    --bg-input-hover: #2C2C2E;
    --text-main: #FFFFFF;
    --text-muted: #8E8E93;
    --primary: #FFFFFF;
    --primary-text: #000000;
    --btn-secondary: #2C2C2E;
    --radius-pill: 9999px;
    --radius-lg: 20px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* =========================================================
     ESTRUTURA
     ========================================================= */
  #app {
    display: flex;
    flex-direction: column;
    flex: 1;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  .screen {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 24px 20px;
    animation: fadeSlide 0.3s ease-out;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(15px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .header-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    height: 40px;
  }

  /* Seta de voltar (CSS puro) */
  .btn-back {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg-input);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .btn-back:hover { background: var(--bg-input-hover); }
  .btn-back::before {
    content: "";
    width: 10px; height: 10px;
    border-top: 2px solid var(--text-main);
    border-left: 2px solid var(--text-main);
    transform: rotate(-45deg);
    margin-left: 4px;
  }

  /* Barra de progresso */
  .progress-line {
    position: absolute;
    top: 0; left: 0; height: 3px;
    background: var(--text-main);
    transition: width 0.4s ease;
    border-radius: 0 4px 4px 0;
    z-index: 10;
  }

  /* =========================================================
     TIPOGRAFIA
     ========================================================= */
  h1 {
    font-size: 32px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 12px;
  }
  .subtitle {
    font-size: 16px;
    color: var(--text-muted);
    margin-bottom: 32px;
    line-height: 1.4;
  }
  .label {
    display: block;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 500;
    margin-left: 16px;
  }

  /* =========================================================
     INPUTS
     ========================================================= */
  .input-group { margin-bottom: 20px; }
  
  .input-pill {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    padding: 18px 20px;
    color: var(--text-main);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-pill::placeholder { color: #5C5C60; }
  .input-pill:focus { border-color: var(--text-main); }
  
  select.input-pill { 
    appearance: none; 
    cursor: pointer;
    background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238E8E93%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat;
    background-position: right 20px top 50%;
    background-size: 12px auto;
  }

  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }

  /* =========================================================
     BOTÕES
     ========================================================= */
  .btn {
    width: 100%;
    padding: 18px;
    border-radius: var(--radius-pill);
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: var(--primary-text); }
  .btn-primary:disabled { background: #2C2C2E; color: #5C5C60; cursor: not-allowed; }
  .btn-secondary { background: var(--btn-secondary); color: var(--text-main); }
  
  .footer-actions { margin-top: auto; display: flex; flex-direction: column; gap: 12px; padding-top: 20px;}

  /* =========================================================
     OPÇÕES (CARTÕES)
     ========================================================= */
  .option-card {
    display: flex;
    align-items: center;
    background: var(--bg-input);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: border-color 0.2s;
  }
  .option-card.selected { border-color: var(--text-main); }
  
  .radio-circle {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid #5C5C60;
    margin-right: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .option-card.selected .radio-circle { border-color: var(--text-main); }
  .option-card.selected .radio-circle::after {
    content: "";
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--text-main);
  }

  .option-text { font-size: 16px; font-weight: 500; flex: 1; }
  .option-badge {
    background: var(--text-main);
    color: var(--bg);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: var(--radius-pill);
  }

  /* =========================================================
     LISTAS E BUSCA
     ========================================================= */
  .search-bar {
    background: var(--bg-input);
    border-radius: var(--radius-pill);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    margin-bottom: 24px;
  }
  .search-bar input {
    background: transparent;
    border: none;
    color: var(--text-main);
    font-size: 16px;
    width: 100%;
    outline: none;
    font-family: inherit;
  }
  .search-bar input::placeholder { color: var(--text-muted); }

  .list-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
  }
  .list-item {
    padding: 16px 20px;
    background: var(--bg-input);
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 2px solid transparent;
  }
  .list-item.selected {
    border-color: var(--text-main);
  }
  .list-item .country-code { color: var(--text-muted); font-size: 14px; }

  /* =========================================================
     OTP
     ========================================================= */
  .otp-container {
    display: flex;
    gap: 8px;
    justify-content: space-between;
    margin-bottom: 32px;
  }
  .otp-input {
    width: 100%;
    height: 60px;
    background: var(--bg-input);
    border: 2px solid transparent;
    border-radius: 12px;
    color: var(--text-main);
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    outline: none;
  }
  .otp-input:focus { border-color: var(--text-main); }

  /* =========================================================
     TELA INICIAL
     ========================================================= */
  .welcome-screen {
    justify-content: center;
    align-items: center;
    text-align: center;
    padding-bottom: 60px;
  }
  .logo-text {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: -3px;
    margin-bottom: 40px;
  }
  .welcome-actions { width: 100%; margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }

  /* =========================================================
     CHECKLIST E AVISOS
     ========================================================= */
  .checklist {
    background: var(--bg-input);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin: 24px 0;
  }
  .checklist-item {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    font-size: 15px;
    font-weight: 500;
    line-height: 1.4;
  }
  .checklist-item:last-child { margin-bottom: 0; }
  .check-mark {
    width: 12px; height: 20px;
    border: solid var(--text-main);
    border-width: 0 2.5px 2.5px 0;
    transform: rotate(45deg);
    flex-shrink: 0;
    margin-top: 2px;
    margin-left: 6px;
  }

  /* Contratos */
  .contract-box {
    background: var(--bg-input);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
  }
  .contract-title { font-weight: 600; font-size: 16px; margin-bottom: 12px; }
  .contract-text { font-size: 14px; color: var(--text-muted); max-height: 100px; overflow-y: auto; line-height: 1.5; }
  .checkbox-row {
    display: flex; align-items: flex-start; gap: 12px; margin-top: 20px; cursor: pointer;
  }
  .checkbox-square {
    width: 24px; height: 24px; border: 2px solid #5C5C60; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .checkbox-row.checked .checkbox-square { background: var(--text-main); border-color: var(--text-main); }
  .checkbox-row.checked .checkbox-square::after {
    content: ""; width: 6px; height: 12px; border: solid var(--bg); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
    margin-top: -2px;
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
/* =========================================================
   DADOS E ESTADO
   ========================================================= */
const $ = (s) => document.querySelector(s);

const COUNTRIES = [
  { n: 'Brasil', c: 'BR', d: '55' },
  { n: 'Alemanha', c: 'DE', d: '49' },
  { n: 'Argentina', c: 'AR', d: '54' },
  { n: 'Estados Unidos', c: 'US', d: '1' },
  { n: 'Espanha', c: 'ES', d: '34' },
  { n: 'França', c: 'FR', d: '33' },
  { n: 'Itália', c: 'IT', d: '39' },
  { n: 'Japão', c: 'JP', d: '81' },
  { n: 'Portugal', c: 'PT', d: '351' },
  { n: 'Reino Unido', c: 'GB', d: '44' }
];

const PROFESSIONS = [
  'Advogado', 'Analista de dados', 'Analista de sistemas', 'Arquiteto', 'Assistente administrativo',
  'Atendente', 'Auditor', 'Autônomo', 'Aposentado', 'Comerciante', 'Consultor jurídico', 'Contador',
  'Dentista', 'Desempregado', 'Desenvolvedor', 'Designer gráfico', 'Diretor escolar', 'Dona ou dono de casa',
  'Eletricista', 'Empresário', 'Enfermeiro', 'Engenheiro civil', 'Engenheiro de software', 'Entregador',
  'Estudante', 'Fisioterapeuta', 'Gerente', 'Jornalista', 'Médico', 'Motorista', 'Nutricionista',
  'Pedagogo', 'Pedreiro', 'Professor', 'Programador', 'Psicólogo', 'Publicitário', 'Servidor público',
  'Trabalhador informal', 'Vendedor'
].sort();

const defaultData = {
  phoneCountry: 'BR',
  phoneNumber: '',
  phoneCode: '',
  nationality: 'BR',
  residence: 'BR',
  docType: '',
  fullName: '',
  birthDate: '',
  addressZip: '',
  addressStreet: '',
  addressNumber: '',
  addressCity: '',
  addressState: '',
  profession: '',
  income: '',
  password: '',
  contracts: { account: false, privacy: false }
};

let state = {
  step: 0,
  data: { ...defaultData }
};

// Recuperar progresso com segurança
try {
  const saved = localStorage.getItem('aurora_fintech_v2');
  if (saved) {
    const parsed = JSON.parse(saved);
    if (typeof parsed.step === 'number' && parsed.step >= 0 && parsed.step <= 15) {
      state = parsed;
    }
  }
} catch(e){}

function save() {
  try { localStorage.setItem('aurora_fintech_v2', JSON.stringify(state)); } catch(e){}
}

/* =========================================================
   CONTROLE DE TELAS
   ========================================================= */
function render() {
  const app = $('#app');
  app.innerHTML = ''; // Limpa a tela

  // Cria a tela e JÁ INSERE no DOM (evita erro de querySelector nulo)
  const screen = document.createElement('div');
  screen.className = 'screen';
  app.appendChild(screen);

  // Barra de progresso
  if (state.step > 0 && state.step < 15) {
    const pct = (state.step / 14) * 100;
    const progress = document.createElement('div');
    progress.className = 'progress-line';
    progress.style.width = `${pct}%`;
    screen.appendChild(progress);
  }

  // Renderiza o conteúdo baseado no step
  switch (state.step) {
    case 0: renderWelcome(screen); break;
    case 1: renderPhone(screen); break;
    case 2: renderOTP(screen); break;
    case 3: renderNationality(screen); break;
    case 4: renderDocType(screen); break;
    case 5: renderName(screen); break;
    case 6: renderBirthDate(screen); break;
    case 7: renderAddress(screen); break;
    case 8: renderProfession(screen); break;
    case 9: renderIncome(screen); break;
    case 10: renderIdentity(screen); break;
    case 11: renderSecurity(screen); break;
    case 12: renderPassword(screen); break;
    case 13: renderReview(screen); break;
    case 14: renderContracts(screen); break;
    case 15: renderStatus(screen); break;
    default: renderWelcome(screen); break;
  }

  window.scrollTo(0, 0);
}

function go(step) {
  state.step = step;
  save();
  render();
}

function next() { go(state.step + 1); }
function back() {
  if (state.step > 0) go(state.step - 1);
}

function headerNav() {
  return `
    <div class="header-nav">
      <button class="btn-back" onclick="back()"></button>
    </div>
  `;
}

/* =========================================================
   TELAS (PASSO A PASSO)
   ========================================================= */

function renderWelcome(screen) {
  screen.className = 'screen welcome-screen';
  screen.innerHTML = `
    <div class="logo-text">Aurora</div>
    
    <div class="welcome-actions">
      <button class="btn btn-primary" onclick="go(1)">Criar conta</button>
      <button class="btn btn-secondary" onclick="alert('Módulo de login separado.')">Fazer login</button>
    </div>
  `;
}

function renderPhone(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Abra uma conta Aurora</h1>
    <p class="subtitle">Insira seu número de celular para começar</p>
    
    <div class="row" style="margin-top: 10px;">
      <div style="flex: 0 0 90px;">
        <select class="input-pill" id="phoneCountry">
          ${COUNTRIES.map(c => `<option value="${c.c}" ${state.data.phoneCountry === c.c ? 'selected' : ''}>+${c.d}</option>`).join('')}
        </select>
      </div>
      <div style="flex: 1;">
        <input type="tel" class="input-pill" id="phoneNumber" placeholder="Insira seu celular" value="${state.data.phoneNumber}">
      </div>
    </div>
    
    <div class="footer-actions">
      <button class="btn btn-primary" id="btnContinue" disabled onclick="submitPhone()">Continuar</button>
    </div>
  `;

  const input = $('#phoneNumber');
  const btn = $('#btnContinue');
  
  if (input.value.length >= 8) btn.disabled = false;
  input.addEventListener('input', (e) => {
    state.data.phoneNumber = e.target.value;
    btn.disabled = e.target.value.length < 8;
  });
}

function submitPhone() {
  state.data.phoneCountry = $('#phoneCountry').value;
  state.data.phoneCode = Math.floor(100000 + Math.random() * 900000).toString();
  save();
  next();
}

function renderOTP(screen) {
  const ddi = COUNTRIES.find(c=>c.c===state.data.phoneCountry).d;
  screen.innerHTML = `
    ${headerNav()}
    <h1>Código de seis dígitos</h1>
    <p class="subtitle">Insira o código enviado para +${ddi} *****-${state.data.phoneNumber.slice(-4)}</p>
    
    <div class="otp-container">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
    </div>
    
    <p style="font-size: 14px; font-weight: 600; color: var(--text-muted);">Código simulado: <span style="color: var(--text-main)">${state.data.phoneCode}</span></p>
    
    <div class="footer-actions">
      <button class="btn btn-primary" onclick="verifyOTP()">Verificar</button>
    </div>
  `;

  const inputs = document.querySelectorAll('.otp-input');
  inputs[0].focus();
  inputs.forEach((inp, idx) => {
    inp.addEventListener('input', () => {
      if (inp.value.length === 1 && idx < 5) inputs[idx + 1].focus();
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && inp.value.length === 0 && idx > 0) inputs[idx - 1].focus();
    });
  });
}

function verifyOTP() {
  const inputs = document.querySelectorAll('.otp-input');
  let code = '';
  inputs.forEach(i => code += i.value);
  
  if (code === state.data.phoneCode) {
    next();
  } else {
    alert('Código incorreto. Use o código simulado exibido na tela.');
  }
}

function renderNationality(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Sua nacionalidade</h1>
    <p class="subtitle">Selecione uma nacionalidade para verificarmos sua identidade.</p>
    
    <div class="search-bar">
      <input type="text" id="searchCountry" placeholder="Pesquisar">
    </div>
    
    <div class="list-container" id="countryList" style="max-height: 380px;">
      ${COUNTRIES.map(c => `
        <div class="list-item ${state.data.nationality === c.c ? 'selected' : ''}" onclick="selectNationality('${c.c}')">
          <span>${c.n}</span>
          ${state.data.nationality === c.c ? '<div class="check-mark"></div>' : ''}
        </div>
      `).join('')}
    </div>
  `;

  $('#searchCountry').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const list = $('#countryList');
    const filtered = COUNTRIES.filter(c => c.n.toLowerCase().includes(q));
    list.innerHTML = filtered.map(c => `
      <div class="list-item ${state.data.nationality === c.c ? 'selected' : ''}" onclick="selectNationality('${c.c}')">
        <span>${c.n}</span>
        ${state.data.nationality === c.c ? '<div class="check-mark"></div>' : ''}
      </div>
    `).join('');
  });
}

function selectNationality(iso) {
  state.data.nationality = iso;
  state.data.residence = iso;
  save();
  next();
}

function renderDocType(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Escolha uma opção de verificação</h1>
    <p class="subtitle">Selecione um documento para verificarmos sua identidade.</p>
    
    <div style="margin-top: 10px;">
      <div class="option-card ${state.data.docType === 'CNH' ? 'selected' : ''}" onclick="selectDoc('CNH')">
        <div class="radio-circle"></div>
        <div class="option-text">Carteira de habilitação</div>
        <div class="option-badge">Mais rápido</div>
      </div>
      <div class="option-card ${state.data.docType === 'RG' ? 'selected' : ''}" onclick="selectDoc('RG')">
        <div class="radio-circle"></div>
        <div class="option-text">Documento de identificação</div>
      </div>
      <div class="option-card ${state.data.docType === 'PASSAPORTE' ? 'selected' : ''}" onclick="selectDoc('PASSAPORTE')">
        <div class="radio-circle"></div>
        <div class="option-text">Passaporte</div>
      </div>
    </div>
    
    <div class="footer-actions">
      <button class="btn btn-primary" onclick="next()" ${!state.data.docType ? 'disabled' : ''}>Continuar</button>
    </div>
  `;
}

function selectDoc(doc) {
  state.data.docType = doc;
  save();
  render();
}

function renderName(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Nome conforme identificação</h1>
    <p class="subtitle">Seu nome completo conforme documento oficial de identificação.</p>
    
    <div class="input-group" style="margin-top: 20px;">
      <input type="text" class="input-pill" id="fullName" placeholder="Nome completo" value="${state.data.fullName}">
    </div>
    
    <div class="footer-actions">
      <button class="btn btn-primary" id="btnName" onclick="submitName()" disabled>Continuar</button>
    </div>
  `;

  const input = $('#fullName');
  const btn = $('#btnName');
  
  if (input.value.trim().split(' ').length >= 2) btn.disabled = false;
  input.addEventListener('input', (e) => {
    state.data.fullName = e.target.value;
    btn.disabled = e.target.value.trim().split(' ').length < 2;
  });
}

function submitName() {
  save();
  next();
}

function renderBirthDate(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Data de nascimento</h1>
    
    <div class="row" style="margin-top: 20px;">
      <input type="text" class="input-pill" id="birthDate" placeholder="DD/MM/AAAA" maxlength="10" value="${state.data.birthDate}">
    </div>
    
    <div class="footer-actions">
      <button class="btn btn-primary" id="btnDate" onclick="submitDate()" disabled>Continuar</button>
    </div>
  `;

  const input = $('#birthDate');
  const btn = $('#btnDate');
  
  if (input.value.length === 10) btn.disabled = false;
  input.addEventListener('input', (e) => {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length > 2) v = v.replace(/^(\d{2})(\d)/, '$1/$2');
    if (v.length > 5) v = v.replace(/^(\d{2})\/(\d{2})(\d)/, '$1/$2/$3');
    e.target.value = v;
    state.data.birthDate = v;
    btn.disabled = v.length < 10;
  });
}

function submitDate() {
  save();
  next();
}

function renderAddress(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Endereço residencial</h1>
    <p class="subtitle">Precisamos do seu endereço para abrir sua conta.</p>
    
    <div class="search-bar">
      <input type="text" placeholder="Pesquisar endereço">
    </div>
    
    <div class="input-group">
      <input type="text" class="input-pill" id="street" placeholder="Rua ou avenida" value="${state.data.addressStreet}">
    </div>
    <div class="row input-group">
      <input type="text" class="input-pill" id="number" placeholder="Número" value="${state.data.addressNumber}">
      <input type="text" class="input-pill" id="zip" placeholder="CEP" value="${state.data.addressZip}">
    </div>
    <div class="row input-group">
      <input type="text" class="input-pill" id="city" placeholder="Cidade" value="${state.data.addressCity}">
      <input type="text" class="input-pill" id="state" placeholder="Estado" value="${state.data.addressState}">
    </div>
    
    <div class="footer-actions">
      <button class="btn btn-primary" onclick="submitAddress()">Continuar</button>
    </div>
  `;
}

function submitAddress() {
  state.data.addressStreet = $('#street').value;
  state.data.addressNumber = $('#number').value;
  state.data.addressZip = $('#zip').value;
  state.data.addressCity = $('#city').value;
  state.data.addressState = $('#state').value;
  save();
  next();
}

function renderProfession(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Sua profissão</h1>
    <p class="subtitle">Selecione sua ocupação atual.</p>
    
    <div class="search-bar">
      <input type="text" id="searchProf" placeholder="Pesquisar">
    </div>
    
    <div class="list-container" id="profList" style="max-height: 350px;">
      ${PROFESSIONS.map(p => `
        <div class="list-item ${state.data.profession === p ? 'selected' : ''}" onclick="selectProf('${p}')">
          <span>${p}</span>
          ${state.data.profession === p ? '<div class="check-mark"></div>' : ''}
        </div>
      `).join('')}
    </div>
  `;

  $('#searchProf').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const list = $('#profList');
    const filtered = PROFESSIONS.filter(p => p.toLowerCase().includes(q));
    list.innerHTML = filtered.map(p => `
      <div class="list-item ${state.data.profession === p ? 'selected' : ''}" onclick="selectProf('${p}')">
        <span>${p}</span>
        ${state.data.profession === p ? '<div class="check-mark"></div>' : ''}
      </div>
    `).join('');
  });
}

function selectProf(prof) {
  state.data.profession = prof;
  save();
  next();
}

function renderIncome(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Renda mensal antes do imposto</h1>
    
    <div class="input-group" style="margin-top: 20px;">
      <div style="position: relative;">
        <span style="position: absolute; left: 20px; top: 18px; color: var(--text-muted); font-weight: 600;">R$</span>
        <input type="number" class="input-pill" id="income" placeholder="0" style="padding-left: 55px;" value="${state.data.income}">
      </div>
    </div>
    
    <div class="checklist">
      <div class="checklist-item">
        <div class="check-mark"></div>
        <span>A renda inclui dinheiro recebido como salário, aluguel, investimentos ou trabalho autônomo.</span>
      </div>
      <div class="checklist-item">
        <div class="check-mark"></div>
        <span>Certifique-se de que o valor seja fornecido antes de impostos.</span>
      </div>
    </div>
    
    <div class="footer-actions">
      <button class="btn btn-primary" id="btnIncome" onclick="submitIncome()" disabled>Continuar</button>
    </div>
  `;

  const input = $('#income');
  const btn = $('#btnIncome');
  
  if (input.value) btn.disabled = false;
  input.addEventListener('input', (e) => {
    state.data.income = e.target.value;
    btn.disabled = !e.target.value;
  });
}

function submitIncome() {
  save();
  next();
}

function renderIdentity(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Antes de continuar</h1>
    <p class="subtitle">Certifique-se de que seu documento atenda aos seguintes critérios.</p>
    
    <div style="margin: 40px auto; width: 100px; height: 140px; border: 3px solid var(--text-main); border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-direction: column;">
      <div style="width: 30px; height: 30px; border: 3px solid var(--text-main); border-radius: 50%;"></div>
      <div style="width: 40px; height: 4px; background: var(--text-main); margin-top: 16px; border-radius: 4px;"></div>
    </div>
    
    <div class="checklist">
      <div class="checklist-item">
        <div class="check-mark"></div>
        <span>Seu documento deve estar dentro da validade.</span>
      </div>
      <div class="checklist-item">
        <div class="check-mark"></div>
        <span>O documento deve estar nítido e bem iluminado.</span>
      </div>
    </div>
    
    <div class="footer-actions">
      <button class="btn btn-primary" onclick="next()">Iniciar captura simulada</button>
    </div>
  `;
}

function renderSecurity(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Segurança</h1>
    <p class="subtitle">Essas informações são obrigatórias por lei.</p>
    
    <div style="margin-top: 10px;">
      <p class="label">Você é uma pessoa exposta politicamente (PEP)?</p>
      <div class="option-card" onclick="next()">
        <div class="radio-circle"></div>
        <div class="option-text">Não</div>
      </div>
      <div class="option-card" onclick="next()">
        <div class="radio-circle"></div>
        <div class="option-text">Sim</div>
      </div>
    </div>
  `;
}

function renderPassword(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Crie uma senha</h1>
    <p class="subtitle">Mínimo de 8 caracteres.</p>
    
    <div class="input-group" style="margin-top: 20px;">
      <input type="password" class="input-pill" id="pwd" placeholder="Senha">
    </div>
    
    <div class="footer-actions">
      <button class="btn btn-primary" id="btnPwd" onclick="submitPassword()" disabled>Continuar</button>
    </div>
  `;

  const input = $('#pwd');
  const btn = $('#btnPwd');
  
  input.addEventListener('input', (e) => {
    state.data.password = e.target.value;
    btn.disabled = e.target.value.length < 8;
  });
}

function submitPassword() {
  save();
  next();
}

function renderReview(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Revise seus dados</h1>
    <p class="subtitle">Confira as informações antes de enviar.</p>
    
    <div class="contract-box">
      <div class="contract-title">Dados Pessoais</div>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Nome:</strong> ${state.data.fullName}</p>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Nascimento:</strong> ${state.data.birthDate}</p>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Profissão:</strong> ${state.data.profession}</p>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Renda:</strong> R$ ${state.data.income}</p>
    </div>
    
    <div class="contract-box">
      <div class="contract-title">Contato e Endereço</div>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Telefone:</strong> +${COUNTRIES.find(c=>c.c===state.data.phoneCountry).d} ${state.data.phoneNumber}</p>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Endereço:</strong> ${state.data.addressStreet}, ${state.data.addressNumber} - ${state.data.addressCity}</p>
    </div>
    
    <div class="footer-actions">
      <button class="btn btn-primary" onclick="next()">Continuar</button>
    </div>
  `;
}

function renderContracts(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Contratos</h1>
    <p class="subtitle">Leia e aceite os termos para abrir sua conta.</p>
    
    <div class="contract-box">
      <div class="contract-title">Contrato de abertura de conta</div>
      <div class="contract-text">Este contrato estabelece as condições de abertura e manutenção da conta digital, os direitos e as obrigações do titular e da instituição, além dos canais de atendimento disponíveis...</div>
      
      <div class="checkbox-row ${state.data.contracts.account ? 'checked' : ''}" onclick="toggleCheck('account')">
        <div class="checkbox-square"></div>
        <span>Li e concordo com o Contrato de Abertura.</span>
      </div>
    </div>
    
    <div class="contract-box">
      <div class="contract-title">Política de Privacidade</div>
      <div class="contract-text">Os dados pessoais são tratados para fins de identificação, prevenção a fraudes e cumprimento de obrigações regulatórias...</div>
      
      <div class="checkbox-row ${state.data.contracts.privacy ? 'checked' : ''}" onclick="toggleCheck('privacy')">
        <div class="checkbox-square"></div>
        <span>Li e concordo com a Política de Privacidade.</span>
      </div>
    </div>
    
    <div class="footer-actions">
      <button class="btn btn-primary" id="btnContracts" onclick="submitContracts()" ${!(state.data.contracts.account && state.data.contracts.privacy) ? 'disabled' : ''}>Enviar solicitação</button>
    </div>
  `;
}

function toggleCheck(type) {
  state.data.contracts[type] = !state.data.contracts[type];
  save();
  render();
}

function submitContracts() {
  next();
}

function renderStatus(screen) {
  screen.innerHTML = `
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center;">
      
      <div style="width: 90px; height: 90px; border-radius: 50%; background: var(--bg-input); display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
        <div class="check-mark" style="border-color: var(--text-main); width: 24px; height: 45px; margin: 0;"></div>
      </div>
      
      <h1>Solicitação enviada</h1>
      <p class="subtitle" style="margin-top: 12px;">Recebemos seus dados. Estamos analisando suas informações e você receberá uma resposta em breve.</p>
      
      <button class="btn btn-primary" onclick="resetApp()" style="margin-top: 40px;">Voltar ao início</button>
    </div>
  `;
}

function resetApp() {
  localStorage.removeItem('aurora_fintech_v2');
  state = { step: 0, data: { ...defaultData } };
  render();
}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
render();
</script>
</body>
</html>
