<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aurora - Abertura de Conta</title>
<style>
  /* =========================================================
     DESIGN SYSTEM - PADRÃO FINTECH INTERNACIONAL (DARK MODE)
     ========================================================= */
  :root {
    --bg: #000000;
    --bg-input: #1C1C1E;
    --bg-input-hover: #2C2C2E;
    --text-main: #FFFFFF;
    --text-muted: #8E8E93;
    --primary: #FFFFFF;
    --primary-text: #000000;
    --btn-secondary: #2C2C2E;
    --border-color: #38383A;
    --radius-pill: 9999px;
    --radius-lg: 24px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  body {
    background-color: var(--bg);
    color: var(--text-main);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.4;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* =========================================================
     ESTRUTURA E LAYOUT
     ========================================================= */
  #app {
    display: flex;
    flex-direction: column;
    flex: 1;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  .screen {
    display: flex;
    flex-direction: column;
    flex: 1;
    padding: 24px 20px;
    animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .header-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
    height: 40px;
  }

  /* Seta de voltar puramente em CSS */
  .btn-back {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg-input);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
  }
  .btn-back:hover { background: var(--bg-input-hover); }
  .btn-back::before {
    content: "";
    width: 10px; height: 10px;
    border-top: 2px solid var(--text-main);
    border-left: 2px solid var(--text-main);
    transform: rotate(-45deg);
    margin-left: 4px;
  }

  .btn-close {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--bg-input);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .btn-close::before, .btn-close::after {
    content: "";
    position: absolute;
    width: 14px; height: 2px;
    background: var(--text-main);
  }
  .btn-close::before { transform: rotate(45deg); }
  .btn-close::after { transform: rotate(-45deg); }

  .progress-line {
    position: absolute;
    top: 0; left: 0; height: 3px;
    background: var(--text-main);
    transition: width 0.4s ease;
    border-radius: 0 4px 4px 0;
  }

  /* =========================================================
     TIPOGRAFIA
     ========================================================= */
  h1 {
    font-size: 32px;
    font-weight: 800;
    line-height: 1.1;
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .subtitle {
    font-size: 16px;
    color: var(--text-muted);
    margin-bottom: 32px;
    line-height: 1.4;
  }
  .label {
    display: block;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-weight: 500;
  }

  /* =========================================================
     CAMPOS E INPUTS
     ========================================================= */
  .input-group { margin-bottom: 20px; }
  
  .input-pill {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    padding: 18px 20px;
    color: var(--text-main);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .input-pill::placeholder { color: #5C5C60; }
  .input-pill:focus { border-color: var(--text-main); background: var(--bg-input-hover); }
  select.input-pill { appearance: none; cursor: pointer; }

  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }

  /* =========================================================
     BOTÕES
     ========================================================= */
  .btn {
    width: 100%;
    padding: 18px;
    border-radius: var(--radius-pill);
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    border: none;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-top: auto;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--primary); color: var(--primary-text); }
  .btn-primary:disabled { background: var(--btn-secondary); color: #5C5C60; cursor: not-allowed; }
  .btn-secondary { background: var(--btn-secondary); color: var(--text-main); }
  
  .footer-actions { margin-top: 32px; display: flex; flex-direction: column; gap: 12px; }

  /* =========================================================
     SELEÇÕES (RÁDIO / CHECK)
     ========================================================= */
  .option-card {
    display: flex;
    align-items: center;
    background: var(--bg-input);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 12px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
  }
  .option-card:hover { background: var(--bg-input-hover); }
  .option-card.selected { border-color: var(--text-main); }
  
  /* Círculo de seleção */
  .radio-circle {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--text-muted);
    margin-right: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.2s;
  }
  .option-card.selected .radio-circle { border-color: var(--text-main); }
  .option-card.selected .radio-circle::after {
    content: "";
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--text-main);
  }

  .option-text { font-size: 16px; font-weight: 500; flex: 1; }
  .option-badge {
    background: var(--text-main);
    color: var(--bg);
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: var(--radius-pill);
  }

  /* =========================================================
     LISTAS E BUSCA
     ========================================================= */
  .search-bar {
    background: var(--bg-input);
    border-radius: var(--radius-pill);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    margin-bottom: 24px;
  }
  .search-bar input {
    background: transparent;
    border: none;
    color: var(--text-main);
    font-size: 16px;
    width: 100%;
    outline: none;
    font-family: inherit;
  }
  .search-bar input::placeholder { color: var(--text-muted); }

  .list-container {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .list-item {
    padding: 16px 20px;
    background: var(--bg-input);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .list-item:hover { background: var(--bg-input-hover); }
  .list-item.selected {
    background: var(--text-main);
    color: var(--bg);
  }
  .list-item .country-code { color: var(--text-muted); font-size: 14px; }
  .list-item.selected .country-code { color: #555; }

  /* =========================================================
     OTP (CÓDIGO DE VERIFICAÇÃO)
     ========================================================= */
  .otp-container {
    display: flex;
    gap: 10px;
    justify-content: space-between;
    margin-bottom: 32px;
  }
  .otp-input {
    width: 48px;
    height: 56px;
    background: var(--bg-input);
    border: 1px solid transparent;
    border-radius: 12px;
    color: var(--text-main);
    font-size: 24px;
    font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }
  .otp-input:focus { border-color: var(--text-main); }

  /* =========================================================
     TELA INICIAL (WELCOME)
     ========================================================= */
  .welcome-screen {
    justify-content: space-between;
    text-align: center;
    padding: 60px 20px 40px;
  }
  .logo-text {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: -2px;
    margin-top: 40px;
  }

  /* =========================================================
     CHECKLIST E AVISOS
     ========================================================= */
  .checklist {
    background: var(--bg-input);
    border-radius: var(--radius-lg);
    padding: 24px;
    margin: 24px 0;
  }
  .checklist-item {
    display: flex;
    gap: 16px;
    margin-bottom: 16px;
    font-size: 15px;
    line-height: 1.4;
  }
  .checklist-item:last-child { margin-bottom: 0; }
  .check-mark {
    width: 12px; height: 20px;
    border: solid var(--text-main);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    flex-shrink: 0;
    margin-top: 4px;
    margin-left: 6px;
  }

  .error-text { color: #FF453A; font-size: 14px; margin-top: 8px; display: none; }

  /* Contratos */
  .contract-box {
    background: var(--bg-input);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
  }
  .contract-title { font-weight: 600; margin-bottom: 8px; }
  .contract-text { font-size: 14px; color: var(--text-muted); max-height: 100px; overflow-y: auto; }
  .checkbox-row {
    display: flex; align-items: flex-start; gap: 12px; margin-top: 16px; cursor: pointer;
  }
  .checkbox-square {
    width: 24px; height: 24px; border: 2px solid var(--text-muted); border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .checkbox-row.checked .checkbox-square { background: var(--text-main); border-color: var(--text-main); }
  .checkbox-row.checked .checkbox-square::after {
    content: ""; width: 6px; height: 12px; border: solid var(--bg); border-width: 0 2px 2px 0; transform: rotate(45deg);
    margin-top: -2px;
  }

</style>
</head>
<body>

<div id="app"></div>

<script>
/* =========================================================
   DADOS E ESTADO
   ========================================================= */
const $ = (s) => document.querySelector(s);

const COUNTRIES = [
  { n: 'Brasil', c: 'BR', d: '55' },
  { n: 'Estados Unidos', c: 'US', d: '1' },
  { n: 'Portugal', c: 'PT', d: '351' },
  { n: 'Reino Unido', c: 'GB', d: '44' },
  { n: 'Espanha', c: 'ES', d: '34' },
  { n: 'Alemanha', c: 'DE', d: '49' },
  { n: 'Angola', c: 'AO', d: '244' },
  { n: 'Moçambique', c: 'MZ', d: '258' },
  { n: 'Japão', c: 'JP', d: '81' },
  { n: 'França', c: 'FR', d: '33' },
  { n: 'Itália', c: 'IT', d: '39' },
  { n: 'Argentina', c: 'AR', d: '54' }
];

const PROFESSIONS = [
  'Médico', 'Enfermeiro', 'Dentista', 'Psicólogo', 'Fisioterapeuta', 'Nutricionista',
  'Professor', 'Pedagogo', 'Diretor escolar', 'Desenvolvedor', 'Programador', 'Analista de sistemas',
  'Engenheiro de software', 'Analista de dados', 'Administrador', 'Gerente', 'Assistente administrativo',
  'Contador', 'Auditor', 'Vendedor', 'Comerciante', 'Atendente', 'Pedreiro', 'Eletricista',
  'Engenheiro civil', 'Arquiteto', 'Motorista', 'Entregador', 'Advogado', 'Consultor jurídico',
  'Designer gráfico', 'Jornalista', 'Publicitário', 'Autônomo', 'Empresário', 'Servidor público',
  'Estudante', 'Aposentado', 'Desempregado', 'Dona ou dono de casa', 'Trabalhador informal'
].sort();

let state = {
  step: 0,
  data: {
    phoneCountry: 'BR',
    phoneNumber: '',
    phoneCode: '',
    phoneVerified: false,
    nationality: '',
    residence: '',
    docType: '',
    fullName: '',
    birthDate: '',
    addressZip: '',
    addressStreet: '',
    addressNumber: '',
    addressCity: '',
    addressState: '',
    profession: '',
    income: '',
    password: '',
    contracts: { account: false, terms: false, privacy: false }
  }
};

// Recuperar progresso
try {
  const saved = localStorage.getItem('aurora_fintech_v1');
  if (saved) state = JSON.parse(saved);
} catch(e){}

function save() {
  localStorage.setItem('aurora_fintech_v1', JSON.stringify(state));
}

/* =========================================================
   CONTROLE DE TELAS
   ========================================================= */
function render() {
  const app = $('#app');
  app.innerHTML = '';

  // Calcula progresso (ex: step 1 até 15)
  const progressPct = state.step === 0 || state.step === 16 ? 0 : (state.step / 15) * 100;

  const screen = document.createElement('div');
  screen.className = 'screen';

  // Barra de progresso no topo
  if (state.step > 0 && state.step < 16) {
    const progress = document.createElement('div');
    progress.className = 'progress-line';
    progress.style.width = `${progressPct}%`;
    screen.appendChild(progress);
  }

  // Lógica de renderização de cada etapa
  switch (state.step) {
    case 0: renderWelcome(screen); break;
    case 1: renderPhone(screen); break;
    case 2: renderOTP(screen); break;
    case 3: renderNationality(screen); break;
    case 4: renderDocType(screen); break;
    case 5: renderName(screen); break;
    case 6: renderBirthDate(screen); break;
    case 7: renderAddress(screen); break;
    case 8: renderProfession(screen); break;
    case 9: renderIncome(screen); break;
    case 10: renderIdentity(screen); break;
    case 11: renderSecurity(screen); break;
    case 12: renderPassword(screen); break;
    case 13: renderReview(screen); break;
    case 14: renderContracts(screen); break;
    case 15: renderStatus(screen); break;
  }

  app.appendChild(screen);
  window.scrollTo(0, 0);
}

function go(step) {
  state.step = step;
  save();
  render();
}

function next() { go(state.step + 1); }
function back() {
  if (state.step > 0) go(state.step - 1);
}

// Componente visual: Header com botão Voltar/Close
function headerNav(showBack = true) {
  return `
    <div class="header-nav">
      ${showBack ? '<button class="btn-back" onclick="back()"></button>' : '<div></div>'}
    </div>
  `;
}

/* =========================================================
   TELAS
   ========================================================= */

function renderWelcome(screen) {
  screen.className = 'screen welcome-screen';
  screen.innerHTML = `
    <div>
      <div class="logo-text">AURORA</div>
    </div>
    <div class="footer-actions">
      <button class="btn btn-primary" onclick="go(1)">Criar conta</button>
      <button class="btn btn-secondary" onclick="alert('Módulo de login separado.')">Fazer login</button>
    </div>
  `;
}

function renderPhone(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Abra uma conta Aurora</h1>
    <p class="subtitle">Insira seu número de celular para começar</p>
    
    <div class="row" style="margin-top: 20px;">
      <div style="flex: 0 0 100px;">
        <select class="input-pill" id="phoneCountry">
          ${COUNTRIES.map(c => `<option value="${c.c}" ${state.data.phoneCountry === c.c ? 'selected' : ''}>+${c.d}</option>`).join('')}
        </select>
      </div>
      <div style="flex: 1;">
        <input type="tel" class="input-pill" id="phoneNumber" placeholder="Insira seu celular" value="${state.data.phoneNumber}">
      </div>
    </div>
    
    <div class="footer-actions" style="margin-top: auto;">
      <button class="btn btn-primary" id="btnContinue" disabled onclick="submitPhone()">Continuar</button>
    </div>
  `;

  const input = $('#phoneNumber');
  const btn = $('#btnContinue');
  
  input.addEventListener('input', (e) => {
    state.data.phoneNumber = e.target.value;
    btn.disabled = e.target.value.length < 8;
  });
  if (input.value.length >= 8) btn.disabled = false;
}

function submitPhone() {
  state.data.phoneCountry = $('#phoneCountry').value;
  state.data.phoneVerified = false;
  state.data.phoneCode = Math.floor(100000 + Math.random() * 900000).toString(); // Código simulado
  save();
  next();
}

function renderOTP(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Código de seis dígitos</h1>
    <p class="subtitle">Insira o código enviado para +${COUNTRIES.find(c=>c.c===state.data.phoneCountry).d} *****-${state.data.phoneNumber.slice(-4)}</p>
    
    <div class="otp-container" id="otpBox">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
      <input type="tel" class="otp-input" maxlength="1" inputmode="numeric">
    </div>
    
    <p style="font-size: 14px; font-weight: 600;">Código simulado: ${state.data.phoneCode}</p>
    
    <div class="footer-actions" style="margin-top: auto;">
      <button class="btn btn-primary" onclick="verifyOTP()">Verificar</button>
    </div>
  `;

  // Auto-focus nos inputs do OTP
  const inputs = document.querySelectorAll('.otp-input');
  inputs[0].focus();
  inputs.forEach((inp, idx) => {
    inp.addEventListener('input', () => {
      if (inp.value.length === 1 && idx < 5) inputs[idx + 1].focus();
    });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && inp.value.length === 0 && idx > 0) inputs[idx - 1].focus();
    });
  });
}

function verifyOTP() {
  const inputs = document.querySelectorAll('.otp-input');
  let code = '';
  inputs.forEach(i => code += i.value);
  
  if (code === state.data.phoneCode) {
    state.data.phoneVerified = true;
    next();
  } else {
    alert('Código incorreto.');
  }
}

function renderNationality(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Sua nacionalidade</h1>
    <p class="subtitle">Selecione para verificarmos sua identidade e residência.</p>
    
    <div class="search-bar">
      <input type="text" id="searchCountry" placeholder="Pesquisar">
    </div>
    
    <div class="list-container" id="countryList" style="max-height: 400px; overflow-y: auto;">
      ${COUNTRIES.map(c => `
        <div class="list-item ${state.data.nationality === c.c ? 'selected' : ''}" onclick="selectNationality('${c.c}')">
          <span>${c.n}</span>
        </div>
      `).join('')}
    </div>
  `;

  $('#searchCountry').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const list = $('#countryList');
    const filtered = COUNTRIES.filter(c => c.n.toLowerCase().includes(q));
    list.innerHTML = filtered.map(c => `
      <div class="list-item ${state.data.nationality === c.c ? 'selected' : ''}" onclick="selectNationality('${c.c}')">
        <span>${c.n}</span>
      </div>
    `).join('');
  });
}

function selectNationality(iso) {
  state.data.nationality = iso;
  state.data.residence = iso; // Simplificação: residência = nacionalidade
  save();
  next();
}

function renderDocType(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Escolha uma opção de verificação</h1>
    <p class="subtitle">Selecione um documento para verificarmos sua identidade.</p>
    
    <div style="margin-top: 24px;">
      <div class="option-card ${state.data.docType === 'CNH' ? 'selected' : ''}" onclick="selectDoc('CNH')">
        <div class="radio-circle"></div>
        <div class="option-text">Carteira de habilitação</div>
        <div class="option-badge">Mais rápido</div>
      </div>
      <div class="option-card ${state.data.docType === 'RG' ? 'selected' : ''}" onclick="selectDoc('RG')">
        <div class="radio-circle"></div>
        <div class="option-text">Documento de identificação nacional</div>
      </div>
      <div class="option-card ${state.data.docType === 'PASSAPORTE' ? 'selected' : ''}" onclick="selectDoc('PASSAPORTE')">
        <div class="radio-circle"></div>
        <div class="option-text">Passaporte</div>
      </div>
    </div>
    
    <div class="footer-actions" style="margin-top: auto;">
      <button class="btn btn-primary" onclick="next()" ${!state.data.docType ? 'disabled' : ''}>Continuar</button>
    </div>
  `;
}

function selectDoc(doc) {
  state.data.docType = doc;
  save();
  render();
}

function renderName(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Nome conforme identificação oficial</h1>
    <p class="subtitle">Seu nome completo conforme documento oficial de identificação.</p>
    
    <div class="input-group" style="margin-top: 24px;">
      <input type="text" class="input-pill" id="fullName" placeholder="Nome completo" value="${state.data.fullName}">
    </div>
    
    <div class="footer-actions" style="margin-top: auto;">
      <button class="btn btn-primary" id="btnName" onclick="submitName()" disabled>Continuar</button>
    </div>
  `;

  const input = $('#fullName');
  const btn = $('#btnName');
  
  input.addEventListener('input', (e) => {
    state.data.fullName = e.target.value;
    btn.disabled = e.target.value.trim().split(' ').length < 2;
  });
  if (input.value.trim().split(' ').length >= 2) btn.disabled = false;
}

function submitName() {
  save();
  next();
}

function renderBirthDate(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Data de nascimento</h1>
    
    <div class="row" style="margin-top: 24px;">
      <input type="number" class="input-pill" id="birthDate" placeholder="DD/MM/AAAA" value="${state.data.birthDate}">
    </div>
    
    <div class="footer-actions" style="margin-top: auto;">
      <button class="btn btn-primary" id="btnDate" onclick="submitDate()" disabled>Continuar</button>
    </div>
  `;

  const input = $('#birthDate');
  const btn = $('#btnDate');
  
  input.addEventListener('input', (e) => {
    state.data.birthDate = e.target.value;
    btn.disabled = e.target.value.length < 8;
  });
}

function submitDate() {
  save();
  next();
}

function renderAddress(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Endereço residencial</h1>
    <p class="subtitle">Precisamos do seu endereço residencial para abrir uma conta.</p>
    
    <div class="search-bar" style="margin-bottom: 16px;">
      <input type="text" placeholder="Pesquisar endereço">
    </div>
    
    <div class="input-group">
      <input type="text" class="input-pill" id="street" placeholder="Rua ou avenida" value="${state.data.addressStreet}">
    </div>
    <div class="row input-group">
      <input type="text" class="input-pill" id="number" placeholder="Número" value="${state.data.addressNumber}">
      <input type="text" class="input-pill" id="zip" placeholder="CEP" value="${state.data.addressZip}">
    </div>
    <div class="row input-group">
      <input type="text" class="input-pill" id="city" placeholder="Cidade" value="${state.data.addressCity}">
      <input type="text" class="input-pill" id="state" placeholder="Estado" value="${state.data.addressState}">
    </div>
    
    <div class="footer-actions" style="margin-top: auto;">
      <button class="btn btn-primary" onclick="submitAddress()">Continuar</button>
    </div>
  `;
}

function submitAddress() {
  state.data.addressStreet = $('#street').value;
  state.data.addressNumber = $('#number').value;
  state.data.addressZip = $('#zip').value;
  state.data.addressCity = $('#city').value;
  state.data.addressState = $('#state').value;
  save();
  next();
}

function renderProfession(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Sua profissão</h1>
    <p class="subtitle">Selecione sua ocupação atual.</p>
    
    <div class="search-bar">
      <input type="text" id="searchProf" placeholder="Pesquisar">
    </div>
    
    <div class="list-container" id="profList" style="max-height: 350px; overflow-y: auto;">
      ${PROFESSIONS.map(p => `
        <div class="list-item ${state.data.profession === p ? 'selected' : ''}" onclick="selectProf('${p}')">
          <span>${p}</span>
        </div>
      `).join('')}
    </div>
  `;

  $('#searchProf').addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    const list = $('#profList');
    const filtered = PROFESSIONS.filter(p => p.toLowerCase().includes(q));
    list.innerHTML = filtered.map(p => `
      <div class="list-item ${state.data.profession === p ? 'selected' : ''}" onclick="selectProf('${p}')">
        <span>${p}</span>
      </div>
    `).join('');
  });
}

function selectProf(prof) {
  state.data.profession = prof;
  save();
  next();
}

function renderIncome(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Renda mensal antes do imposto</h1>
    
    <div class="input-group" style="margin-top: 24px;">
      <div style="position: relative;">
        <span style="position: absolute; left: 20px; top: 18px; color: var(--text-muted);">R$</span>
        <input type="number" class="input-pill" id="income" placeholder="0" style="padding-left: 50px;" value="${state.data.income}">
      </div>
    </div>
    
    <div class="checklist">
      <div class="checklist-item">
        <div class="check-mark"></div>
        <span>A renda inclui dinheiro recebido como salário, aluguel, investimentos ou trabalho autônomo.</span>
      </div>
      <div class="checklist-item">
        <div class="check-mark"></div>
        <span>Certifique-se de que o valor seja fornecido antes de impostos.</span>
      </div>
    </div>
    
    <div class="footer-actions" style="margin-top: auto;">
      <button class="btn btn-primary" id="btnIncome" onclick="submitIncome()" disabled>Continuar</button>
    </div>
  `;

  const input = $('#income');
  const btn = $('#btnIncome');
  
  input.addEventListener('input', (e) => {
    state.data.income = e.target.value;
    btn.disabled = !e.target.value;
  });
}

function submitIncome() {
  save();
  next();
}

function renderIdentity(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Antes de continuar</h1>
    <p class="subtitle">Certifique-se de que seu documento atenda aos seguintes critérios.</p>
    
    <div style="margin: 40px auto; width: 100px; height: 140px; border: 2px solid var(--text-main); border-radius: 16px; display: flex; align-items: center; justify-content: center; flex-direction: column;">
      <div style="width: 30px; height: 30px; border: 2px solid var(--text-main); border-radius: 50%;"></div>
      <div style="width: 40px; height: 3px; background: var(--text-main); margin-top: 16px;"></div>
    </div>
    
    <div class="checklist">
      <div class="checklist-item">
        <div class="check-mark"></div>
        <span>Seu documento deve estar dentro da validade.</span>
      </div>
      <div class="checklist-item">
        <div class="check-mark"></div>
        <span>O documento deve estar nítido e bem iluminado.</span>
      </div>
    </div>
    
    <div class="footer-actions" style="margin-top: auto;">
      <button class="btn btn-primary" onclick="next()">Iniciar captura simulada</button>
    </div>
  `;
}

function renderSecurity(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Segurança</h1>
    <p class="subtitle">Essas informações são obrigatórias por lei.</p>
    
    <div style="margin-top: 24px;">
      <p class="label">Você é uma pessoa exposta politicamente (PEP)?</p>
      <div class="option-card" onclick="next()">
        <div class="radio-circle"></div>
        <div class="option-text">Não</div>
      </div>
      <div class="option-card" onclick="next()">
        <div class="radio-circle"></div>
        <div class="option-text">Sim</div>
      </div>
    </div>
  `;
}

function renderPassword(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Crie uma senha</h1>
    <p class="subtitle">Mínimo de 8 caracteres.</p>
    
    <div class="input-group" style="margin-top: 24px;">
      <input type="password" class="input-pill" id="pwd" placeholder="Senha">
    </div>
    
    <div class="footer-actions" style="margin-top: auto;">
      <button class="btn btn-primary" id="btnPwd" onclick="submitPassword()" disabled>Continuar</button>
    </div>
  `;

  const input = $('#pwd');
  const btn = $('#btnPwd');
  
  input.addEventListener('input', (e) => {
    state.data.password = e.target.value;
    btn.disabled = e.target.value.length < 8;
  });
}

function submitPassword() {
  save();
  next();
}

function renderReview(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Revise seus dados</h1>
    <p class="subtitle">Confira as informações antes de enviar.</p>
    
    <div class="contract-box">
      <div class="contract-title">Dados Pessoais</div>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Nome:</strong> ${state.data.fullName}</p>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Nascimento:</strong> ${state.data.birthDate}</p>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Profissão:</strong> ${state.data.profession}</p>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Renda:</strong> R$ ${state.data.income}</p>
    </div>
    
    <div class="contract-box">
      <div class="contract-title">Contato e Endereço</div>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Telefone:</strong> +${COUNTRIES.find(c=>c.c===state.data.phoneCountry).d} ${state.data.phoneNumber}</p>
      <p style="font-size: 14px; margin-bottom: 8px;"><strong>Endereço:</strong> ${state.data.addressStreet}, ${state.data.addressNumber} - ${state.data.addressCity}</p>
    </div>
    
    <div class="footer-actions" style="margin-top: auto;">
      <button class="btn btn-primary" onclick="next()">Continuar</button>
    </div>
  `;
}

function renderContracts(screen) {
  screen.innerHTML = `
    ${headerNav()}
    <h1>Contratos</h1>
    <p class="subtitle">Leia e aceite os termos para abrir sua conta.</p>
    
    <div class="contract-box">
      <div class="contract-title">Contrato de abertura de conta</div>
      <div class="contract-text">Este contrato estabelece as condições de abertura e manutenção da conta digital, os direitos e as obrigações do titular e da instituição, além dos canais de atendimento disponíveis...</div>
      
      <div class="checkbox-row" id="checkAccount" onclick="toggleCheck('account')">
        <div class="checkbox-square"></div>
        <span>Li e concordo com o Contrato de Abertura.</span>
      </div>
    </div>
    
    <div class="contract-box">
      <div class="contract-title">Política de Privacidade</div>
      <div class="contract-text">Os dados pessoais são tratados para fins de identificação, prevenção a fraudes e cumprimento de obrigações regulatórias...</div>
      
      <div class="checkbox-row" id="checkPrivacy" onclick="toggleCheck('privacy')">
        <div class="checkbox-square"></div>
        <span>Li e concordo com a Política de Privacidade.</span>
      </div>
    </div>
    
    <div class="footer-actions" style="margin-top: auto;">
      <button class="btn btn-primary" id="btnContracts" onclick="submitContracts()" disabled>Enviar solicitação</button>
    </div>
  `;
}

function toggleCheck(type) {
  state.data.contracts[type] = !state.data.contracts[type];
  save();
  
  const el = $(`#check${type.charAt(0).toUpperCase() + type.slice(1)}`);
  if (state.data.contracts[type]) {
    el.classList.add('checked');
  } else {
    el.classList.remove('checked');
  }
  
  const btn = $('#btnContracts');
  btn.disabled = !(state.data.contracts.account && state.data.contracts.privacy);
}

function submitContracts() {
  next();
}

function renderStatus(screen) {
  screen.innerHTML = `
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; margin-top: 40px;">
      <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--bg-input); display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
        <div class="check-mark" style="border-color: var(--text-main); width: 20px; height: 40px; margin: 0;"></div>
      </div>
      
      <h1>Solicitação enviada</h1>
      <p class="subtitle" style="margin-top: 12px;">Recebemos seus dados. Estamos analisando suas informações e você receberá uma resposta em breve.</p>
      
      <button class="btn btn-primary" onclick="resetApp()" style="margin-top: 40px;">Voltar ao início</button>
    </div>
  `;
}

function resetApp() {
  localStorage.removeItem('aurora_fintech_v1');
  state = { step: 0, data: { phoneCountry: 'BR', phoneNumber: '', phoneCode: '', phoneVerified: false, nationality: '', residence: '', docType: '', fullName: '', birthDate: '', addressZip: '', addressStreet: '', addressNumber: '', addressCity: '', addressState: '', profession: '', income: '', password: '', contracts: { account: false, terms: false, privacy: false } } };
  render();
}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
render();
</script>
</body>
</html>
